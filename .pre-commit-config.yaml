#!/bin/sh
# Pre-commit hooks 配置
# 安装: pip install pre-commit && pre-commit install
# 手动运行: pre-commit run --all-files

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # 与 CI（.github/workflows/ci.yml 固定 ruff==0.16.3）及 requirements.lock 保持一致，
    # 避免本地 hook 与 CI 使用不同 ruff 版本导致格式化行为漂移
    rev: v0.16.3
    hooks:
      - id: ruff
        args: [--fix, --show-fixes]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    # O28（2026-09-29 审查 P1）：mypy hook 从 v1.7.1 升级到 v1.15.0——
    # v1.7.1 是 2023 年版本，Python 3.12+ 类型支持不完整；v1.15.0 是
    # 2025 年最新稳定版。
    rev: v1.15.0
    hooks:
      - id: mypy
        # O28（2026-09-29 审查 P1）：删除 types-all（已废弃的 shim 包，
        # 2023 年起被 typeshed 内置类型替代；保留会导致 mypy 报
        # "unknown package" 或拉入不兼容的 stub 版本）。
        # 用 additional_dependencies 显式列出所需的 types-* 包：
        # types-requests（requests 类型）、types-PyYAML（YAML 类型）
        additional_dependencies: [types-requests, types-PyYAML]
        args: [--ignore-missing-imports, --no-strict-optional]
        exclude: ^tests/

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: check-merge-conflict

  # 4.2 日志脱敏自动检查：新增/修改 .py 文件时扫描 logger 调用点，
  # 参数含敏感字段名（api_key/secret/password/Bearer/sk- 等）且未经
  # _redact / mask_sensitive_info 脱敏 → 报可疑点并失败（exit 1）。
  # 与 CI（ci.yml "Audit log redaction" 步骤）共用同一脚本，保证本地与远端口径一致。
  - repo: local
    hooks:
      - id: audit-log-redaction
        name: audit-log-redaction (4.2)
        entry: python scripts/gates/audit_log_redaction.py
        language: system
        files: '^src/.*\.py$|^experiments/.*\.py$'
        pass_filenames: false

      # P1（2026-10-10 优化建议落地）：密钥泄漏守卫前移到本地提交时点。
      # 复用 .git-hooks/check_secret_leak.sh（O17 全口径：sk- / 32+ hex /
      # 命名凭证赋值 / JWT / Bearer / AWS / URL userinfo），扫描 staged 新文件
      # + 未跟踪文件。与 CI gitleaks 工作树扫描形成双层防线——本地即时阻断，
      # 而非等 push 后 CI 才发现。命中疑似真实凭证即 exit 1 阻断提交。
      - id: secret-leak-guard
        name: secret-leak-guard (O17 全口径密钥泄漏)
        entry: sh .git-hooks/check_secret_leak.sh
        language: system
        pass_filenames: false
