[tool.ruff]
# Ruff 配置文件
# 快速 Python lint 工具，替代 flake8 + pydocstyle + isort

# 与 setup.py python_requires（>=3.12）及 CI 矩阵下限 3.12 对齐
target-version = "py312"
line-length = 120

[tool.ruff.lint]
# 启用的规则集
select = [
    "E",    # pycodestyle 错误
    "W",    # pycodestyle 警告
    "F",    # pyflakes
    "I",    # isort 导入排序
    "C90",  # mccabe 复杂度检查
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify 代码简化
    "PERF", # perflint 性能优化
    "RET",  # flake8-return 返回语句改进
    "RUF",  # ruff 自有规则（排除中文全角误报 001/002/003）
]

# 忽略的规则（与项目风格冲突的）
ignore = [
    "E501",  # 行长度由 line-length 控制
    "W191",  # 允许缩进使用空格
    "C901",  # 允许函数复杂度超过阈值（设计决策，非 bug）
    "RUF001",  # 模糊 unicode 字符（全角逗号/引号等中文标点，注释中大量存在，误报）
    "RUF002",  # 模糊 unicode 字符（同上，中文注释误报）
    "RUF003",  # 模糊 unicode 字符（同上，中文注释误报）
]

[tool.ruff.lint.isort]
# 导入排序配置
known-first-party = ["src", "config"]
known-third-party = ["langchain", "langgraph", "pytest"]
force-single-line = false
case-sensitive = true

[tool.ruff.lint.mccabe]
# 最大复杂度阈值
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
# 测试文件忽略某些规则
"tests/**" = ["PLR2004"]  # 允许测试中的魔数
"examples/**" = ["E501"]  # 示例代码允许长行

[tool.mypy]
# 第三方库缺少 py.typed/stubs 时跳过其分析（不影响本仓代码类型检查）
[[tool.mypy.overrides]]
module = [
    "scipy.*",
    "datasets",
    "dbutils.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
# pytest 配置
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --timeout=1200"
timeout = 1200
markers = [
    "slow: 标记为慢速测试（需 API）",
    "integration: 集成测试",
    "unit: 单元测试",
]
filterwarnings = [
    # scipy ttest_ind 对"近恒定"分组数据（全 0/全 1 配对）计算矩时会出现
    # catastrophic cancellation（精度损失），属统计检验的已知数值特性，
    # 结果已按 NaN 占位处理（test_viz_significance 锁定该行为），忽略此告警
    "ignore:Precision loss occurred in moment calculation:RuntimeWarning",
]
