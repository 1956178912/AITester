    graph_state: 100         # 状态 schema 初始化路由（1.0000）

# O-∞（R5 审查 2026-10-09，MET-01/EXP-01 收口）：**target_quality**——被测代码
# 侧的一等公民指标。此前这批数字**已采集在批次工件里但从未登记**，导致项目
# "测试生成系统"身份无法与 2025–2026 前沿（CoverUp 90% line+branch、
# TestAgent 92.34% line / 83.69% mutation（Java 主结果）、ULT 45.10% stmt / 40.21% mutation）
# 对话。本节由零 LLM 存量重放固化：
#   python -m experiments.target_quality_replay experiments/results/main_batch
# 产物：experiments/results/main_batch/target_quality_report.md（随批次入库）。
target_quality:
  # 口径纪律（与 repair_caliber_matrix.md §3 同）：引用须带批次 + 臂 + n；
  # 跨代际合计仅作描述性概览，**不是对外口径**。
  target_line_coverage_pct:  # 被测代码行覆盖率（results.<arm>.details[].coverage）
    # 观察：aitester 84.0–93.6%，**系统性低于** plain_llm 86.0–97.2%——
    # 与 detection 的 −28pp 同向，构成"完整系统覆盖率也更低"的第二条独立证据。
    aitester: [84.0, 93.6]   # 10 批次区间（n=87/批，2026-10-06/07）
    plain_llm: [86.0, 97.2]  # 同上
    plain_llm_df: [81.5, 93.6]
    note: "高覆盖 ≠ 高检出：aitester 覆盖率 84–94% 而检出率仅 13–16%。归因依据（2026-10-10 独立审查更正引用）：① MUTGEN（TSE 2026, DOI 10.1109/tse.2026.3682975）实测存在 100% 行覆盖仅 4% 变异得分的套件；② 覆盖率-缺陷检出相关性批评的正确出处为 Zhao, Zhou & Cohen（ISSTA 2026, DOI 10.1145/3832093），其结论为限定性而非全称——覆盖+变异在回归（无缺陷代码）设定下做**跨模型比较**是有效的（branch vs raw mutation r=0.780 @k=10，控制规模后），而在**被测代码可能有缺陷**时不可靠（此时变异分析不适用）。本项目场景属后者，故不得单独以覆盖率作为有效性证据。⚠️ 此前本条把该结论误挂到 'ULT/TOSEM 26' 名下——ULT（UnLeakedTestbench, TOSEM 2026, DOI 10.1145/3805043）是**基准论文**，不主张相关性结论"
  mutation_score:            # 变异得分（0–1，details[].mutation_score）
    aitester: [0.818, 0.976]  # 2026-10-06/07 七批次区间（n=77–81/批）
    plain_llm: [0.951, 0.992]
    plain_llm_df: [0.986, 0.997]
    note: "接近饱和（尤其 df 0.986–0.997）：合成集变异体过弱，该指标在此数据集上鉴别力有限，须在 ULT/TestGenEval 外部基准重测"
  spec_compile_rate:         # 规约可编译率（"逻辑驱动"内核的可测量证据）
    # T-11 复测（2026-10-13，零 LLM 存量重放，报告 experiments/results/emse_t11_spec_compile_20261013/T11_REPORT.md）。
    # ⚠️ 2026-10-11 SpecExpr 文法契约（W2/T1，SPEC_IR_DSL_ENABLE=true）改变编译口径，
    # 契约前后数值不可直接对比；契约后无成规模实测，无法给出单一"当前值"，按数据集/批次分层。
    rechecked: "2026-10-14"
    aitester:
      synthetic_post_grammar: 0.6397        # 契约后合成集·**新度量门**（2026-10-14 §6.9 修门后重测，seed45/46 × 87 = n=174；s45 0.6761/s46 0.6033，s46 指纹探针瞬态失败已披露）——旧门值 0.3102（n=174，修前排）主要为**度量假象**：同任务新抽样 expr 覆盖率不变（0.693→0.686/0.748→0.707）而 unknown_name 拒绝崩塌（129→35/141→53）；QuixBugs/ULT 行为旧门值，新门重测进行中
      examples_post_grammar: 0.500         # 契约后 examples，10-12 n=2（仅方向性）
      quixbugs_post_grammar: 0.6321        # 契约后真实基准首测（**旧度量门**）：10-14 spec_ir pilot（emse_spec_ir_quixbugs_20261013，干净口径，n=50）；新门重测进行中（QuixBugs Planner 降级率低，预计上修幅度小于 synthetic）
      ult_post_grammar: 0.5626            # 契约后 ULT 首测（**旧度量门**）：10-14 探针（emse_ult_specir_probe_20261014，25 任务干净口径，n=25；detection 0/24——ULT 生成测试不产红，检测口径适配性另议）；新门重测进行中
      quixbugs_pre_grammar: [0.234, 0.324] # 契约前最新 QuixBugs（10-10 logic_ab c1-c4，n=46×4，pooled 0.2696/n=184，仍 <0.35）
    note: "T-11 复测结论（2026-10-13）：契约后仅合成集 n=5=0.52 与 examples n=2=0.50，统计意义不足。**2026-10-14 更新**：① spec_ir pilot 补齐契约后真实基准首测——QuixBugs n=50=0.6321（≥0.35）；② 确认性跑批（预注册 docs/study/SPECEXPR_SYNTH_CONFIRM_PREREG_2026-10-14.md）synthetic detection 阴性（δ=−0.57pp，§6.8，主因=基线天花板）；③ **§6.9 修门（Planner 降级静默失败 + 内建类型名值位置）后 synthetic 新门值 n=174=0.6397**——旧门 0.3102 的「数据集分化」主要为度量假象（同任务新抽样 expr 覆盖率不变、unknown_name 拒绝崩塌 129→35/141→53）；QuixBugs/ULT 新门重测进行中，完成后本表统一为新门口径。对外引用必须带数据集标签。旧登记 0.205–0.219（10-07 E1/E2）双重滞后（既晚于文法契约，也晚于 10-09 合成 0.263–0.517 / 10-09·10 QuixBugs 0.23–0.32）。建议：QuixBugs/ULT 新门重测收口后统一口径；后续如仍低于 0.35 再评估 DSL 扩展（当前 synthetic 新门 0.64 已高于阈值，扩展优先级下降）"
  spec_expr_coverage:        # 表达式通道覆盖率（与 spec_compile_rate 正交）
    aitester:
      synthetic_post_grammar: 0.7202       # 10-14 确认性跑批 specir 臂 pooled（seed45 0.6928/seed46 0.7477，n=70+70；替换 10-13 D2 冒烟 n=4=0.746）
      quixbugs_post_grammar: 0.6069        # 10-14 spec_ir pilot n=45（emse_spec_ir_quixbugs_20261013）
      quixbugs_pre_grammar: [0.587, 0.625] # 10-10 logic_ab c1-c4，n=39–44（契约前最新可靠参考）
      synthetic_pre_20261007: [0.723, 0.741] # 旧登记 E1/E2 n=45/51（历史参考，已滞后）
    note: "契约后成规模实测（10-14）：synthetic n=140=0.7203、QuixBugs n=45=0.6069——表达式通道覆盖率契约前后稳定（契约前 0.587–0.625）；与 spec_compile_rate 的契约后数据集分化（0.63 vs 0.31）正交：**覆盖率稳定而可编译率分化**——LLM 能形式化，但受限表达式 DSL 对 synthetic 子句接受率低（unknown_name 拒绝为主），两通道必须并报"
  specificity_gate:          # 特异性门终审分布（跨批次合计，**纯描述性**）
    aitester: {specific_red: 40, over_red: 66}
    plain_llm_df: {specific_red: 162, over_red: 140}
    # T5（2026-10-11 独立评审落地）：**撤回原"过红是 −28pp 主机制"归因**。
    # 原 note 用 specific_red/over_red ≈ 0.61 vs 1.16 作为机制证据，两条
    # 独立证据均不支持：
    #   ① 门与检出指标**同源**——实测 450 个非 None verdict 上
    #      specific_red→detection=1 为 206/206、over_red→detection=0 为
    #      244/244，**真实分歧 0**（确定性互补）；用检出解释检出，不构成
    #      独立证据；
    #   ② 该比例**随文件子集变动**（10 文件全量 0.61/1.16；前 7 文件
    #      0.50/1.00），且 84–93% 的行**根本没有 verdict**，分母不稳定。
    # 真实主机制已由实测定位为**测试生成侧不产红**：aitester 296/609 行
    # （48.6%）两版生成测试在缺陷原码上全绿（detection_first_status=
    # all_green_unverified、iterations=0、无补丁），且这些行每行含
    # ≥3 条 assert（均值 15.3）——不是"没写断言"，而是断言全部通过；
    # 对照 plain_llm_df 仅 2.5%（15/609）。反事实分解（缺口 201 行）：
    # 对齐"产红率"贡献 44.2%、对齐"红→检出转化率"贡献 26.1%、交互 29.7%。
    # 本字段保留为描述性分布，**不得再用于机制归因**。
    note: "纯描述性：aitester specific_red/over_red = 40/66，plain_llm_df = 162/140。⚠️ 不得用于机制归因——门与检出指标同源（206/206 与 244/244 零分歧），且该比例随文件子集变动（0.61/1.16 ↔ 0.50/1.00）、84–93% 的行无 verdict。真实主机制是'测试生成侧不产红'（aitester 48.6% 行全绿未检出，df 仅 2.5%）"

static_checks:
  ruff_version: "0.16.3"     # 与 CI 固定版本一致（requirements.lock）
  ruff_warnings: 0
  mypy_errors: 0
  mypy_source_files: 130     # 2026-10-12 质量债清偿批次实测（`mypy src/ config.py` → Success: no issues found in 130 source files）；此前 125（2026-10-11）与 10-12 批次新增 5 源文件（spec_ir_v2 / spec_first / orchestration_search 等）后未刷新

python_ci_matrix: ["3.12", "3.13", "3.14"]   # CI 矩阵（scipy>=3.12 为下限）

error_categories: 18         # ErrorCategory 当前类别数（18 类，2026-10-01 独立审查 N6 更正：此前误记 17，实跑枚举为 18）

synthetic_templates: 50      # P0-5（2026-10-05 V 批次）：唯一缺陷 pattern 总数（30→50；scripts/tools/verify_synthetic_templates.py 三重不变量全库自验证 50/50 通过——buggy 可检出 + fixed 自洽 + 测试数口径无漂移；6 个存量模板的 gold 材料缺陷已修复）

# O30（D.4-7 修复）：benchmark 节——承载当前有效的主实验指标，
# 守卫脚本 check_baseline_numbers.py 校验文档引用与本节一致性。
# 新工件落地后（run_benchmark.py 产出含 detection_rate 的批次）刷新本节点。
benchmark:
  # M1（2026-09-29 审查 P0）：三指标口径（替代旧 success_rate 单一指标）
  #   detection_rate  = 生成测试在已知缺陷代码上变红的比例（fail-to-pass 三段判定：
  #                     buggy 红 + fixed 绿 + 无收集/语法错误；2026-10-01 R1 修正）
  #   repair_rate     = 补丁应用后独立测试判定修复正确的比例
  #   false_fix_rate  = 测试通过但源码未变 / 补丁仅改测试的比例
  # 2026-10-01 独立审查 R42/R52/R53 增补：test_error_rate（坏测试直接防线）/
  # oracle_type + test_visible_to_system（APR 严谨性检查点 #2）/
  # patch_plausible + patch_correct + patch_precision（过拟合度量）/
  # source_patched_unverified + patch_evidence_level（R33 源码腐蚀风险观测）/
  # fl_at_k（R8 Ochiai FL@1/3/5 定位质量）/
  # A-01（2026-10-04 系统审查 P0）：spec_compile_rate（SpecIR v2 可编译规约占比，
  #   "逻辑驱动"主张的可测量内核；SPEC_IR_DSL_ENABLE=true 启用，默认关）
  # A-03（2026-10-04 系统审查 P0）：patch_rollback_verdict + patch_rolled_back
  #   （快照/P2P 全量回归/失败自动回滚协议观测；PATCH_SNAPSHOT_ROLLBACK_ENABLE=true
  #   启用，默认关；regression_failed 时自动回滚 target_code 到快照原文；
  #   PATCH_ROLLBACK_FAIL_CLOSED=true 时 rc>=2/超时/IO 异常口径也触发回滚）
  # R1c（2026-10-05 审查 P0）：spec_oracle_injected（确定性规约 oracle 注入
  #   观测；SPEC_ORACLE_EXEC_ENABLE=true 启用，默认关——compile_spec_oracle
  #   产物与 LLM 测试并列执行，"逻辑驱动"通道的确定性检出）
  # R5（2026-10-05 审查 P0）：mutation_detection_rate / mutants_killed /
  #   mutants_total（生成测试对 gold fixed 的 AST 变异体检出比例——测试
  #   有效性的客观裁决，SWE-Mutation 2026 口径；ENABLE_MUTATION_SCORING=true
  #   时 run_benchmark 逐基线写入结果行，默认关）
  # AC（2026-10-06 第十轮审查 T-P0-2/T-P0-4）：spec_expr_coverage（表达式
  #   通道覆盖率——LLM 把 NL 规约形式化为 *_expr 子句的占比，与
  #   spec_compile_rate 的编译器接受率正交；SPEC_IR_DSL_ENABLE=true 时写入）
  #   + specificity_gate_verdict（特异性门终审 specific_red/over_red/
  #   unavailable）+ red_regression_violation（红回归门抹红拦截标记）；
  #   后两者经 DETECTION_SPECIFICITY_GATE_ENABLE / RED_REGRESSION_GATE_ENABLE
  #   启用（logic 档注入，ADR-0016 双门协议扩展）。
  # 修复引擎批次 I/II（2026-10-07 范式转向）：llm_localization（RGFL 式
  #   LLM 推理定位结构化结果，批次 II 起含 Top-3 候选排序与 expected_logic）
  #   + localization_hit_function（元素级 Hit@1：首位候选 ∈ gold 变更函数集合）
  #   + localization_hit_function_at_3 / localization_mrr（元素级 Top-3 命中与
  #   MRR，批次 II 起与 Hit@1 并列；未定位/无 gold 材料时 None 占位）
  # 修复引擎批次 III（2026-10-07）：edit_intent_status（编辑意图确定性
  #   落盘观测 {"ok","applied","total","diagnostics"}；EDIT_INTENT_ENABLE
  #   默认关时恒 None；ok=False = 确定性引擎拒绝并回落整文件补丁通道）
  # 修复引擎批次 XIV（2026-10-07，ADR-0028 观测层）：fl_constraint_verdict /
  #   fl_constraint_hit_rank / fl_constraint_changed_functions（FL Top-k
  #   约束观测门——补丁变更函数集合与定位 Top-3 候选求交，hit/miss/
  #   not_evaluable + 首个命中候选序数；ADR-0024"生成侧主导"行级验证器）
  #   + oracle_quality_history（generator 逐次测试质量快照序列）+
