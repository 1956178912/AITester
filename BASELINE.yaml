# 新工件落地后（run_benchmark.py 产出含 detection_rate 的批次）刷新本节点。
benchmark:
  # M1（2026-09-29 审查 P0）：三指标口径（替代旧 success_rate 单一指标）
  #   detection_rate  = 生成测试在已知缺陷代码上变红的比例（fail-to-pass 三段判定：
  #                     buggy 红 + fixed 绿 + 无收集/语法错误；2026-10-01 R1 修正）
  #   repair_rate     = 补丁应用后独立测试判定修复正确的比例
  #   false_fix_rate  = 测试通过但源码未变 / 补丁仅改测试的比例
  # 2026-10-01 独立审查 R42/R52/R53 增补：test_error_rate（坏测试直接防线）/
  # oracle_type + test_visible_to_system（APR 严谨性检查点 #2）/
  # patch_plausible + patch_correct + patch_precision（过拟合度量）/
  # source_patched_unverified + patch_evidence_level（R33 源码腐蚀风险观测）/
  # fl_at_k（R8 Ochiai FL@1/3/5 定位质量）/
  # A-01（2026-10-04 系统审查 P0）：spec_compile_rate（SpecIR v2 可编译规约占比，
  #   "逻辑驱动"主张的可测量内核；SPEC_IR_DSL_ENABLE=true 启用，默认关）
  # A-03（2026-10-04 系统审查 P0）：patch_rollback_verdict + patch_rolled_back
  #   （快照/P2P 全量回归/失败自动回滚协议观测；PATCH_SNAPSHOT_ROLLBACK_ENABLE=true
  #   启用，默认关；regression_failed 时自动回滚 target_code 到快照原文；
  #   PATCH_ROLLBACK_FAIL_CLOSED=true 时 rc>=2/超时/IO 异常口径也触发回滚）
  # R1c（2026-10-05 审查 P0）：spec_oracle_injected（确定性规约 oracle 注入
  #   观测；SPEC_ORACLE_EXEC_ENABLE=true 启用，默认关——compile_spec_oracle
  #   产物与 LLM 测试并列执行，"逻辑驱动"通道的确定性检出）
  # R5（2026-10-05 审查 P0）：mutation_detection_rate / mutants_killed /
  #   mutants_total（生成测试对 gold fixed 的 AST 变异体检出比例——测试
  #   有效性的客观裁决，SWE-Mutation 2026 口径；ENABLE_MUTATION_SCORING=true
  #   时 run_benchmark 逐基线写入结果行，默认关）
  # AC（2026-10-06 第十轮审查 T-P0-2/T-P0-4）：spec_expr_coverage（表达式
  #   通道覆盖率——LLM 把 NL 规约形式化为 *_expr 子句的占比，与
  #   spec_compile_rate 的编译器接受率正交；SPEC_IR_DSL_ENABLE=true 时写入）
  #   + specificity_gate_verdict（特异性门终审 specific_red/over_red/
  #   unavailable）+ red_regression_violation（红回归门抹红拦截标记）；
  #   后两者经 DETECTION_SPECIFICITY_GATE_ENABLE / RED_REGRESSION_GATE_ENABLE
  #   启用（logic 档注入，ADR-0016 双门协议扩展）。
  metrics_schema:
    [detection_rate, repair_rate, false_fix_rate, regression_rate, test_error_rate,
     oracle_type, test_visible_to_system, patch_plausible, patch_correct,
     patch_precision, source_patched_unverified, patch_evidence_level, fl_at_k,
     spec_compile_rate, patch_rollback_verdict, patch_rolled_back,
     mutation_detection_rate, mutants_killed, mutants_total,
     spec_expr_coverage, specificity_gate_verdict, red_regression_violation]
  current_main_batch: "experiments/results/main_batch/benchmark_synthetic_20261006_140906.json"
