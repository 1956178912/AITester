# O-∞（R5 审查 2026-10-09，MET-01/EXP-01 收口）：**target_quality**——被测代码
# 侧的一等公民指标。此前这批数字**已采集在批次工件里但从未登记**，导致项目
# "测试生成系统"身份无法与 2025–2026 前沿（CoverUp 90% line+branch、
# TestAgent 92.34% line / 83.69% mutation（Java 主结果）、ULT 45.10% stmt / 40.21% mutation）
# 对话。本节由零 LLM 存量重放固化：
#   python -m experiments.target_quality_replay experiments/results/main_batch
# 产物：experiments/results/main_batch/target_quality_report.md（随批次入库）。
target_quality:
  # 口径纪律（与 repair_caliber_matrix.md §3 同）：引用须带批次 + 臂 + n；
  # 跨代际合计仅作描述性概览，**不是对外口径**。
  target_line_coverage_pct:  # 被测代码行覆盖率（results.<arm>.details[].coverage）
    # 观察：aitester 84.0–93.6%，**系统性低于** plain_llm 86.0–97.2%——
    # 与 detection 的 −28pp 同向，构成"完整系统覆盖率也更低"的第二条独立证据。
    aitester: [84.0, 93.6]   # 10 批次区间（n=87/批，2026-10-06/07）
    plain_llm: [86.0, 97.2]  # 同上
    plain_llm_df: [81.5, 93.6]
    note: "高覆盖 ≠ 高检出：aitester 覆盖率 84–94% 而检出率仅 13–16%。归因依据（2026-10-10 独立审查更正引用）：① MUTGEN（TSE 2026, DOI 10.1109/tse.2026.3682975）实测存在 100% 行覆盖仅 4% 变异得分的套件；② 覆盖率-缺陷检出相关性批评的正确出处为 Zhao, Zhou & Cohen（ISSTA 2026, DOI 10.1145/3832093），其结论为限定性而非全称——覆盖+变异在回归（无缺陷代码）设定下做**跨模型比较**是有效的（branch vs raw mutation r=0.780 @k=10，控制规模后），而在**被测代码可能有缺陷**时不可靠（此时变异分析不适用）。本项目场景属后者，故不得单独以覆盖率作为有效性证据。⚠️ 此前本条把该结论误挂到 'ULT/TOSEM 26' 名下——ULT（UnLeakedTestbench, TOSEM 2026, DOI 10.1145/3805043）是**基准论文**，不主张相关性结论。【2026-10-17 独立评审 A-10 补验：该 DOI 已定位一手论文——《Do Coverage and Mutation Scores of LLM-Generated Test Suites Correlate with Their Effectiveness? (Replicability Study)》，PACMSE 3(ISSTA) Article ISSTA002, pp.30-53, arXiv:2607.22880；r=0.780@k=10 已逐位核验（论文 §4.3 正文 + Table 7：branch coverage vs raw mutation score，Pearson r=0.780, p=0.002，inter-model 视图/平均聚合/bug-free 输入/固定套件规模 k=10），引用准确】"
  mutation_score:            # 变异得分（0–1，details[].mutation_score）
    aitester: [0.818, 0.976]  # 2026-10-06/07 七批次区间（n=77–81/批）
    plain_llm: [0.951, 0.992]
    plain_llm_df: [0.986, 0.997]
    note: "接近饱和（尤其 df 0.986–0.997）：合成集变异体过弱，该指标在此数据集上鉴别力有限，须在 ULT/TestGenEval 外部基准重测"
  spec_compile_rate:         # 规约可编译率（"逻辑驱动"内核的可测量证据）
    # T-11 复测（2026-10-13，零 LLM 存量重放，报告 experiments/results/emse_t11_spec_compile_20261013/T11_REPORT.md）。
    # ⚠️ 2026-10-11 SpecExpr 文法契约（W2/T1，SPEC_IR_DSL_ENABLE=true）改变编译口径，
    # 契约前后数值不可直接对比；契约后无成规模实测，无法给出单一"当前值"，按数据集/批次分层。
    rechecked: "2026-10-14"
    aitester:
      synthetic_post_grammar: 0.6397        # 契约后合成集·**新度量门**（2026-10-14 §6.9 修门后重测，seed45/46 × 87 = n=174；s45 0.6761/s46 0.6033，s46 指纹探针瞬态失败已披露）——旧门值 0.3102（n=174，修前排）主要为**度量假象**：同任务新抽样 expr 覆盖率不变（0.693→0.686/0.748→0.707）而 unknown_name 拒绝崩塌（129→35/141→53）；QuixBugs/ULT 行为旧门值，新门重测进行中
      examples_post_grammar: 0.500         # 契约后 examples，10-12 n=2（仅方向性）
      quixbugs_post_grammar: 0.7161        # 契约后真实基准·**新度量门**（10-14 修门后重测，emse_calib_quixbugs_20261014，干净口径 n=50）——旧门值 0.6321（同批任务，Planner 降级率低故上修 +8.4pp，小于 synthetic 的 +33pp）
      ult_post_grammar: 0.5937            # 契约后 ULT·**新度量门**（10-14 修门后重测，emse_calib_ult_20261014，25 任务 n=25）——旧门值 0.5626（上修 +3.1pp）；detection 0/24——ULT 生成测试不产红，检测口径适配性另议
      quixbugs_pre_grammar: [0.234, 0.324] # 契约前最新 QuixBugs（10-10 logic_ab c1-c4，n=46×4，pooled 0.2696/n=184，仍 <0.35）
    note: "T-11 复测结论（2026-10-13）：契约后仅合成集 n=5=0.52 与 examples n=2=0.50，统计意义不足。**2026-10-14 更新**：① spec_ir pilot 补齐契约后真实基准首测——QuixBugs n=50=0.6321（≥0.35）；② 确认性跑批（预注册 docs/emse/SPECEXPR_SYNTH_CONFIRM_PREREG_2026-10-14.md）synthetic detection 阴性（δ=−0.57pp，§6.8，主因=基线天花板）；③ **§6.9 修门（Planner 降级静默失败 + 内建类型名值位置）后三数据集新门校准完成：QuixBugs 0.7161（n=50，+8.4pp）/ ULT 0.5937（n=25，+3.1pp）/ synthetic 0.6397（n=174，+33pp）**——旧门各值的差异主要为**度量假象**（Planner 降级率越高上修越大：同任务新抽样 expr 覆盖率不变而 unknown_name 拒绝崩塌）；本表已统一为新门口径，旧门值保留于行内注释供历史审计。对外引用必须带数据集标签。旧登记 0.205–0.219（10-07 E1/E2）双重滞后（既晚于文法契约，也晚于 10-09 合成 0.263–0.517 / 10-09·10 QuixBugs 0.23–0.32）。结论（新门口径）：三数据集全部 ≥0.35，'逻辑驱动'可编译率主张成立；旧门口径的数据集分化（0.63/0.56/0.31）系度量假象已勘误。DSL 扩展优先级下调（当前无证据显示受限表达式是瓶颈）。**2026-10-15 批次六 DSL v4 门口径**：本表三值为 **v4 前门**全任务口径；v4（冒号/切片 + sum/set/bool/hasattr + values/keys/items/get/isupper/islower/bit_length）后同口径任务级约 +3pp——依据=emse_dsl_diag3 语料（719 Planner 缓存条目/607 去重子句/91 任务）受控对账（子句级 0.8847→0.9127、任务级均值 0.8809→0.9110、收复 17/回退 0，工件 experiments/results/emse_dsl_extend_recheck_20261015/）。受控估计≠全任务重测（未做 LLM 重跑），故本表数值不刷新，引用须带门标签（v4 前门 / v4 后门）。残余拒绝多数合法（内部变量 43 + 域名属性/模块链/自递归 10）"
  spec_expr_coverage:        # 表达式通道覆盖率（与 spec_compile_rate 正交）
    aitester:
      synthetic_post_grammar: 0.7202       # 10-14 确认性跑批 specir 臂 pooled（seed45 0.6928/seed46 0.7477，n=70+70；替换 10-13 D2 冒烟 n=4=0.746）
      quixbugs_post_grammar: 0.6069        # 10-14 spec_ir pilot n=45（emse_spec_ir_quixbugs_20261013）
      quixbugs_pre_grammar: [0.587, 0.625] # 10-10 logic_ab c1-c4，n=39–44（契约前最新可靠参考）
      synthetic_pre_20261007: [0.723, 0.741] # 旧登记 E1/E2 n=45/51（历史参考，已滞后）
    note: "契约后成规模实测（10-14）：synthetic n=140=0.7203、QuixBugs n=45=0.6069——表达式通道覆盖率契约前后稳定（契约前 0.587–0.625）；与 spec_compile_rate 的契约后数据集分化（0.63 vs 0.31）正交：**覆盖率稳定而可编译率分化**——LLM 能形式化，但受限表达式 DSL 对 synthetic 子句接受率低（unknown_name 拒绝为主），两通道必须并报"
  specificity_gate:          # 特异性门终审分布（跨批次合计，**纯描述性**）
    aitester: {specific_red: 40, over_red: 66}
    plain_llm_df: {specific_red: 162, over_red: 140}
    # T5（2026-10-11 独立评审落地）：**撤回原"过红是 −28pp 主机制"归因**。
    # 原 note 用 specific_red/over_red ≈ 0.61 vs 1.16 作为机制证据，两条
    # 独立证据均不支持：
    #   ① 门与检出指标**同源**——实测 450 个非 None verdict 上
    #      specific_red→detection=1 为 206/206、over_red→detection=0 为
    #      244/244，**真实分歧 0**（确定性互补）；用检出解释检出，不构成
    #      独立证据；
    #   ② 该比例**随文件子集变动**（10 文件全量 0.61/1.16；前 7 文件
    #      0.50/1.00），且 84–93% 的行**根本没有 verdict**，分母不稳定。
    # 真实主机制已由实测定位为**测试生成侧不产红**：aitester 296/609 行
    # （48.6%）两版生成测试在缺陷原码上全绿（detection_first_status=
    # all_green_unverified、iterations=0、无补丁），且这些行每行含
    # ≥3 条 assert（均值 15.3）——不是"没写断言"，而是断言全部通过；
    # 对照 plain_llm_df 仅 2.5%（15/609）。反事实分解（缺口 201 行）：
    # 对齐"产红率"贡献 44.2%、对齐"红→检出转化率"贡献 26.1%、交互 29.7%。
    # 本字段保留为描述性分布，**不得再用于机制归因**。
    note: "纯描述性：aitester specific_red/over_red = 40/66，plain_llm_df = 162/140。⚠️ 不得用于机制归因——门与检出指标同源（206/206 与 244/244 零分歧），且该比例随文件子集变动（0.61/1.16 ↔ 0.50/1.00）、84–93% 的行无 verdict。真实主机制是'测试生成侧不产红'（aitester 48.6% 行全绿未检出，df 仅 2.5%）"
