# AITester 当前基线（机器可读单一事实来源）
#
# 用途：核心维护文档（README / QUICKSTART / api_reference / algorithm_design /
#       usage_examples）的"当前基线"数字统一引用本文件，避免多文档各自硬编码
#       造成漂移。历史版本表（CHANGELOG / api_reference 的版本演进节）记录
#       的是当时快照，不随本文件刷新——本文件只维护"当前"。
#
# 维护约定（见 CONTRIBUTING.md "文档组织约定"）：
#   - 任何功能批次落地后，必须同步更新本文件的 last_verified 与对应数字；
#   - 数字以全量 pytest / ruff / mypy 实测输出为准（CI 3.14 矩阵）；
#   - 过期内容不得就地标注在本文件，历史快照归 docs/history/。

version: "1"
last_verified: "2026-10-06"   # 全量回归实测日期（R1-R18 + N 复审批次 + S/T 优化批次 + 同日 U 系统性审查落地批次 + 同日 V 独立审查优化批次 + 同日 W 审查优化落地批次（检出优先协议/基线健全性修复/真实基准加载器/ratchet/文档治理）+ 2026-10-05 X 第七轮审查落地批次（缓存命名空间/plain_llm_df 归因基线/统计 schema 过滤/C5 repo 守卫/env 预算棘轮/py.typed）+ 2026-10-06 凌晨 Y 冒烟补遗批次（真实 LLM 冒烟验证 + 检出优先终态第三值 red_not_repaired + regeneration_count 透出 + telemetry MAST 对齐 + README 瘦身）+ 2026-10-06 Z 第八轮审查落地批次（策略银行提示/补丁隔离 + 再生成上限单一事实源 + 缓存 commit 全等校验 + 功效分析脚本 + 贝叶斯配对分析 + 双语门禁扩围/数据卡/Makefile），全绿 4195）+ 同日 AA 代码优化批次（logic 档补 DETECTION_FIRST_ENABLE〔ADR-0015 漏配补齐〕/ synthetic max_pattern_repeat 采样上限 + run_benchmark --max-pattern-repeat / README CI 矩阵漂移修复与静态守卫），全绿 4207）

tests:
