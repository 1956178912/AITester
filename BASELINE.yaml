  total_failed: 0
  slim_environment: 1863     # 缺 chromadb/matplotlib 时 RAG/可视化用例自动跳过
  suite_seconds: 49          # 全量耗时量级（串行 ~49s；P0-2 空补丁短路消除 100s 级 LLM 重采样路径后。2026-10-01 性能批次：引入 pytest-xdist，CI/本地 -n 4 并行 ~22s）

