last_verified: "2026-10-27"   # 全量回归实测日期（**EA 轮（2026-10-27，零 LLM，$0）**：OTel 导出的 span 区间锚错了端点——`src/observability/otel_export.py` 的 `_record_to_span` 把记录的 `ts` 一律当 span 起点，而 `record_node` / `record_task_end` 都在操作**完成时**取 `time.time()`（duration 从 `t0` 起算）⇒ node / task_end 的每段时长向未来延伸，真实会话实测 planner span 结束比导出时刻晚 99ms、task_end 晚 419ms（整整一个任务时长），父子区间不闭合。修法 = task_start 的 ts 是起点、不位移；node / task_end 有可用 duration 时 `start = ts − duration`，区间闭合在记录时刻；ts 不可用（0 哨兵）不位移；duration > ts 自相矛盾时以结束时刻为准裁到 `[0, ts]` 并披露 `span_interval_clamped`（披露顺序在原 ts → duration 之后、token 之前）。新增 14 例 EA 锁（`tests/test_otel_export_span_anchor_ea.py`），AQ 两条起点断言按新契约改写（用例数不变）。预登记跑 13,133 passed / 3 failed / 257 skipped、collected 13,393、134.89s / 51 warnings / rc=2（三红 = 基线守卫 `test_tests_and_mypy_are_current` + 真树两例 `test_registration_readers_cf`）；刷新后 ⇒ 13,136。覆盖率行 19,722/20,237 = 97.4552%（未覆盖 515）、分支 7,253/7,686 = 94.3664%（缺弧 433）——本轮 `src/observability/otel_export.py` 改动，非继承态；行/弧分母各 +6/+4 = 新增 if/else 的执行面，覆盖各 +6/+4、未覆盖与缺弧 ±0，不作全局回收或退化主张。`ruff format --check .` 末行实测 1,029。三次终跑 `make gates` 全绿（13,136 passed / 0 failed / 257 skipped，均 rc=0；链内 pytest **133.73s / 86 warnings、133.82s / 95 warnings、137.82s / 26 warnings**，链墙钟 229s / 154s / 176s），取第三跑 137.82s 记为 `suite_seconds: 138`；回填后验证跑 rc=0（链内 136.93s / 30 warnings、链墙钟 230s，同一 collected 13,393，全链全绿）。**DZ 轮（2026-10-26，零 LLM，$0）**：OTel 导出的整任务时长静默丢失——`src/observability/otel_export.py` 的 `_record_to_span` 只读 `duration_ms`（node 事件字段），而 `TraceSession.record_task_end` 写的是 `duration_s`（秒）⇒ task_end 映射出的 root span `duration_unix_nano` 恒 0，且不产生任何 `aitester.export_value_reasons` 披露（消费方无法区分「没有时长」与「时长为 0」）。修法 = 按字段名选单位（`duration_s` 按秒、`duration_ms` 按毫秒；两者并存时 `duration_s` 优先，防 task_end 的 extra 注入改写任务级时长），坏值沿用同一值域（非有限/负/bool/非数值回落 0 并给 `duration_s_*` 机制名）。新增 7 例 DZ 锁（`tests/test_otel_export_task_duration_dz.py`）。预登记跑 13,119 passed / 3 failed / 257 skipped、collected 13,379、135.99s / 36 warnings / rc=2（三红 = 基线守卫 `test_tests_and_mypy_are_current` + 真树两例 `test_registration_readers_cf`）；刷新后 ⇒ 13,122。覆盖率行 19,716/20,231 = 97.4544%（未覆盖 515）、分支 7,249/7,682 = 94.3634%（缺弧 433）——本轮 `src/observability/otel_export.py` 改动，非继承态；行/弧分母各 +2（新增 if/else 的两条语句与两条弧），覆盖各 +2、未覆盖与缺弧 ±0，不作全局回收或退化主张。`ruff format --check .` 末行实测 1,028。三次终跑 `make gates` 全绿（13,122 passed / 0 failed / 257 skipped，均 rc=0；链内 pytest 134.30s / 18 warnings、132.55s / 26 warnings、147.92s / 33 warnings，链墙钟 292s / 162s / 212s），取第三跑 147.92s 记为 `suite_seconds: 148`；回填后验证跑 rc=0（链内 145.99s / 58 warnings、链墙钟 205s，同一 collected 13,379，全链全绿）。**DY 轮（2026-10-26，零 LLM，$0）**：追踪会话构造/收尾的两个失真——① `TraceSession.__init__` 的 docstring 承诺「目录创建失败降级为 no-op（不阻断主流程）」，但 `os.makedirs` 未设防，`AITESTER_TRACE_DIR` 指向普通文件之下时构造抛 `NotADirectoryError`，而 `start_task_trace` 在 `_run_single_task` 的 try 之外调用 ⇒ `run` 把每个任务改写成「崩溃」、一个都没跑（`orchestration_search` 的同一调用点同样会中断实验任务）；② `_started_at` 只在文件追踪分支赋值，纯内存（默认）模式的 `task_end` 因此缺 `duration_s`——诊断快照的耗时字段取决于是否开文件追踪。修法 = 构造期 `makedirs` 失败仅告警并降级为仅内存快照（records 照常进环形缓冲、`--dump-trace-on-failure` 仍可导出），`_started_at` 在会话创建时无条件赋值。新增 4 例 DY 锁（`tests/test_trace_session_degrade_dy.py`）。预登记跑 13,112 passed / 3 failed / 257 skipped、collected 13,372、136.72s / 65 warnings / rc=2（三红 = 基线守卫 `test_tests_and_mypy_are_current` + 真树两例 `test_registration_readers_cf`）；刷新后 ⇒ 13,115。覆盖率行 19,714/20,229 = 97.4541%（未覆盖 515）、分支 7,247/7,680 = 94.3620%（缺弧 433）——本轮 `src/observability/trace.py` 改动，非继承态；行分母 ±0 / 覆盖 +5（未覆盖 520 → 515），弧分母与覆盖均 ±0（`try/except` 不产生可判定弧），不作全局回收或退化主张。`ruff format --check .` 末行实测 1,027。三次终跑 `make gates` 全绿（13,115 passed / 0 failed / 257 skipped，均 rc=0；链内 pytest 134.24s / 66 warnings、135.09s / 32 warnings、136.08s / 66 warnings，链墙钟 302s / 155s / 154s），取第三跑 136.08s 记为 `suite_seconds: 136`；回填后验证跑 rc=0（链内 137.66s / 18 warnings、链墙钟 169s，同一 collected 13,372，全链全绿）。**DX 轮（2026-10-26，零 LLM，$0）**：诊断快照导出契约的三种失真——① `dump_recent_to_with_reason` / `dump_recent_to` 对 `limit` 不做校验，`limit=0` 命中 `recent[-0:]`（在 Python 里等于整段）导出全部而非零条，负值静默错切（实测 `-2` 只导出末 1 条）；② 文件名只取 `int(time.time())` 秒级时间戳，同一秒内的第二次或并发导出互相覆盖，N 个调用方只留