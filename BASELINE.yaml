  #     "生成侧合成质量"（ADR-0024 归因 + bug_type 分层解混杂通过）
  #   成本（$/task，价目表 2026-10-06 官方登记口径）：aitester 0.0259 /
  #     plain_llm 0.0034 / plain_llm_df 0.0045 USD（agnes 未登记不参与计价）
  #   provenance 瑕疵：三批次 git_dirty=true（--allow-dirty 口径跑批），
  #     pooled 报告已就地勘误；报告引用工件入库由 check_artifacts_tracked.py
  #     CI 强制（AK3）
  # 统计报告：statistical_report_3seed_pooled.md（合并口径 261 对）+
