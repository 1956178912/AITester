  #   （与 E2 及 E6 预注册预算口径一致，preregistration.md:96）/ parallelism=4 /
  #   LLM 缓存开（namespace seed42）/ git_dirty=true（--allow-dirty，同 R-P0-2 先例）。
  #   **A1 消融（plan 去 expected_output）**：aitester standard 9.2%（8/87）
  #   vs strip 9.2%（8/87），配对 McNemar 不一致对仅 2、χ²=0.500、
  #   精确二项 p=1.0000、δ=+0.0pp → **H-A1 不成立**（该路径撤回）。
  #   效力限定：34/87（39%）任务 Planner 回退空计划（test_cases=[]），干预空转；
  #   剩余 61% 任务上仍为零效应。
  #   **E6 control（−28pp 第三次独立复现）**：detection aitester 9.2%（8/87）
  #   vs plain_llm_df 34.5%（30/87）vs plain_llm 0.0%（0/87）；配对 χ²=16.962、
  #   δ=−25.3pp（方向与量级复现 R-P0-2 δ=−0.279 / E2 δ=−0.3673）。
