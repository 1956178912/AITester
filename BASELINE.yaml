  total_failed: 0
  slim_environment: 1863     # 上一次精简环境实测（2026-10-05 N 批次；S/T/U/V 批次未重测精简环境——新增用例均为纯 stdlib 或仅依赖既有可选依赖口径）
  suite_seconds: 118          # 全量耗时量级（pytest-xdist -n 4 实测 ~112-120s；V 批次新增模板验证用例含子进程 pytest，较 U 批次 34s 变慢为预期）

