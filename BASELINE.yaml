  total_failed: 0
  slim_environment: 1863     # 上一次精简环境实测（2026-10-05 N 批次；S/T/U/V/W/X/Y/Z 批次未重测精简环境——新增用例均为纯 stdlib 或仅依赖既有可选依赖口径；AA 批新增用例同为纯 stdlib 口径）
  suite_seconds: 35           # 全量耗时量级（pytest-xdist -n 4 实测；AA 批次 36-38s，量级"分钟内"不变）

coverage:
