# O30（D.4-7 修复）：benchmark 节——承载当前有效的主实验指标，
# 守卫脚本 check_baseline_numbers.py 校验文档引用与本节一致性。
# 新工件落地后（run_benchmark.py 产出含 detection_rate 的批次）刷新本节点。
benchmark:
  # M1（2026-09-29 审查 P0）：三指标口径（替代旧 success_rate 单一指标）
  #   detection_rate  = 生成测试在已知缺陷代码上变红的比例（fail-to-pass 三段判定：
  #                     buggy 红 + fixed 绿 + 无收集/语法错误；2026-10-01 R1 修正）
  #   repair_rate     = 补丁应用后独立测试判定修复正确的比例
  #   false_fix_rate  = 测试通过但源码未变 / 补丁仅改测试的比例
  # 2026-10-01 独立审查 R42/R52/R53 增补：test_error_rate（坏测试直接防线）/
  # oracle_type + test_visible_to_system（APR 严谨性检查点 #2）/
  # patch_plausible + patch_correct + patch_precision（过拟合度量）/
  # source_patched_unverified + patch_evidence_level（R33 源码腐蚀风险观测）/
  # fl_at_k（R8 Ochiai FL@1/3/5 定位质量）/
  # A-01（2026-10-04 系统审查 P0）：spec_compile_rate（SpecIR v2 可编译规约占比，
  #   "逻辑驱动"主张的可测量内核；SPEC_IR_DSL_ENABLE=true 启用，默认关）
  # A-03（2026-10-04 系统审查 P0）：patch_rollback_verdict + patch_rolled_back
  #   （快照/P2P 全量回归/失败自动回滚协议观测；PATCH_SNAPSHOT_ROLLBACK_ENABLE=true
  #   启用，默认关；regression_failed 时自动回滚 target_code 到快照原文；
  #   PATCH_ROLLBACK_FAIL_CLOSED=true 时 rc>=2/超时/IO 异常口径也触发回滚）
  # R1c（2026-10-05 审查 P0）：spec_oracle_injected（确定性规约 oracle 注入
  #   观测；SPEC_ORACLE_EXEC_ENABLE=true 启用，默认关——compile_spec_oracle
  #   产物与 LLM 测试并列执行，"逻辑驱动"通道的确定性检出）
  # R5（2026-10-05 审查 P0）：mutation_detection_rate / mutants_killed /
  #   mutants_total（生成测试对 gold fixed 的 AST 变异体检出比例——测试
  #   有效性的客观裁决，SWE-Mutation 2026 口径；ENABLE_MUTATION_SCORING=true
  #   时 run_benchmark 逐基线写入结果行，默认关）
  # AC（2026-10-06 第十轮审查 T-P0-2/T-P0-4）：spec_expr_coverage（表达式
  #   通道覆盖率——LLM 把 NL 规约形式化为 *_expr 子句的占比，与
  #   spec_compile_rate 的编译器接受率正交；SPEC_IR_DSL_ENABLE=true 时写入）
  #   + specificity_gate_verdict（特异性门终审 specific_red/over_red/
  #   unavailable）+ red_regression_violation（红回归门抹红拦截标记）；
  #   后两者经 DETECTION_SPECIFICITY_GATE_ENABLE / RED_REGRESSION_GATE_ENABLE
  #   启用（logic 档注入，ADR-0016 双门协议扩展）。
  # 修复引擎批次 I/II（2026-10-07 范式转向）：llm_localization（RGFL 式
  #   LLM 推理定位结构化结果，批次 II 起含 Top-3 候选排序与 expected_logic）
  #   + localization_hit_function（元素级 Hit@1：首位候选 ∈ gold 变更函数集合）
  #   + localization_hit_function_at_3 / localization_mrr（元素级 Top-3 命中与
  #   MRR，批次 II 起与 Hit@1 并列；未定位/无 gold 材料时 None 占位）
  # 修复引擎批次 III（2026-10-07）：edit_intent_status（编辑意图确定性
  #   落盘观测 {"ok","applied","total","diagnostics"}；EDIT_INTENT_ENABLE
  #   默认关时恒 None；ok=False = 确定性引擎拒绝并回落整文件补丁通道）
  # 修复引擎批次 XIV（2026-10-07，ADR-0028 观测层）：fl_constraint_verdict /
  #   fl_constraint_hit_rank / fl_constraint_changed_functions（FL Top-k
  #   约束观测门——补丁变更函数集合与定位 Top-3 候选求交，hit/miss/
  #   not_evaluable + 首个命中候选序数；ADR-0024"生成侧主导"行级验证器）
  #   + oracle_quality_history（generator 逐次测试质量快照序列）+
  #   self_repair_trap_suspected / self_repair_trap_signals（Self-Repair
  #   Trap 三信号观测——DCAware 口径；passed 历史口径零变化，阻断/
  #   策略档 Proposed 待预注册）
  # I 轮（2026-10-16，归因链接线）：failure_bucket / failure_bucket_detail /
  #   attribution_edge / attribution_fault_side（`observability.failure_taxonomy`
  #   的五桶终局失效分类 + 批次 XII 的 edge × fault_side 增补维度，此前
  #   **零生产调用点**——写侧与单测齐备但批次工件一处不落，归因链末端不可
  #   机读；现由 `run_benchmark._failure_attribution_for_result` 逐任务写入，
  #   喂入口径为 `effective_stop_reason`〔O35：final_state 里 stop_reason 恒
  #   None〕+ G3 抬升的顶层 logic_degraded。**无工作流终局状态的行（运行
  #   异常/限流耗尽）四键为 None 而非 uncategorized——缺席 ≠ 通过**，且批次
  #   聚合把它们单列 unclassified_rows 不折进任何桶）+ m10_leaf_fallback
  #   （ADR-0032 的 M10 降级归因分离标记：logic_degraded=True 时区分"提取器
  #   叶子回退误诊"与"LLM 真未输出 logic_analysis"；此前只写进 test_plan
  #   内部 → 实验层读不到 → 可分离性不可机读，且默认计划替换会把标记一起
  #   丢掉。纯观测，五键均不参与路由）
  metrics_schema:
    [detection_rate, repair_rate, false_fix_rate, regression_rate, test_error_rate,
     oracle_type, test_visible_to_system, patch_plausible, patch_correct,
     patch_precision, source_patched_unverified, patch_evidence_level, fl_at_k,
     llm_localization, localization_hit_function, localization_hit_function_at_3,
     localization_mrr, edit_intent_status, edit_localization, deterministic_repair_status,
     patch_abstained, patch_abstain_signals,
     spec_compile_rate, patch_rollback_verdict, patch_rolled_back,
     mutation_detection_rate, mutants_killed, mutants_total,
     spec_expr_coverage, specificity_gate_verdict, red_regression_violation,
     fl_constraint_verdict, fl_constraint_hit_rank, fl_constraint_changed_functions,
     oracle_quality_history, self_repair_trap_suspected, self_repair_trap_signals,
     spec_oracle_injected, spec_oracle_verdict,
    spec_replace_applied,
     failure_bucket, failure_bucket_detail, attribution_edge, attribution_fault_side,
