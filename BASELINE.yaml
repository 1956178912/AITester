      a1_p_rope: 0.9691
      a1_verdict: "实际等价（95% CI 完全落在 ROPE ±5pp 内）"
      e6_df_mcnemar_chi2: 16.962
      e6_df_bh_fdr_q: 0.0067
      e6_df_bayes_delta: -0.2418
      e6_df_cluster_chi2_adj: 6.60
      e6_df_sign_test_p: 0.0034
      e6_pl_sign_test_p: 0.0625
