# ⚠️ 口径澄清（R5 审查 2026-10-09，MET-01）：本节是 **meta_coverage**——
#   即 AITester **自身源码**（--cov=src）的测试覆盖率，不是被测代码的覆盖率。
#   两者同名易混，且 2025–2026 前沿论文（CoverUp/FSE'25、TestAgent 2026、
#   ULT/TOSEM'26）中的 "coverage" 一律指**被测代码**。对外引用必须显式区分；
#   被测代码覆盖率见下方 target_quality 节。
coverage:                    # = meta_coverage（项目自身源码），勿与 target_quality 混用
  line_total_pct: 92.42      # --cov=src 总行覆盖（2026-10-12 实测 92.42%，14243/15411 行；此前 89（2026-10-07 AO 批次实测 89.56）滞后刷新——ratchet 水位（docs/coverage_ratchet.yaml）已 92.40，本声明值与 ratchet 对齐）
  line_core_modules:
    base_agent: 70
    api_manager: 90
    dataset_loader: 91
    graph_nodes: 70
    code_analyzer: 89
    planner: 89
    dependency: 82
    multi_candidate: 84
    cross_file: 91
    rag_retriever: 86
  branch_total_pct: 86.91   # --cov=src --cov-branch 总分支覆盖（2026-10-12 实测 86.91%，4940/5684 分支；此前 83（2026-10-07 AO 批次实测 82.78）滞后刷新——ratchet 水位（docs/coverage_ratchet.yaml）已 86.90，本声明值与 ratchet 对齐）
  branch_core_routing:       # 核心条件路由模块分支覆盖（scripts/gates/check_branch_coverage.py 门槛 85%）
