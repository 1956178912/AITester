  locked_flags: 37           # 有代码锁（测试/工装文件里既出现该开关、又点名这道门）的声明开关数（DF 轮 +1 = 新门的 `--list` 已被 tests/test_dependency_audit_gate.py 点名；`--require-audit` 计入 passed 类，两类互斥）——读者敏感，随文本变；**CJ 轮（2026-10-25）29 → 30**：`tests/test_citations_gate.py` 以 `gate.main(["--files", ...])` 调 `check_citations.py`，令其 `--files` 从「范围呈现档无读者」转入本类（同轮 presentation_unread 22 → 21，恒等式 73 = 14 + 30 + 8 + 0 + 21 两侧各自成立）；DB 轮 +2 = 新门的 `--require-paper` 与 `--list` 已被 tests/test_bibtex_compilability_gate.py 点名
