155s，同一 collected 13,357，全链全绿）。**DV 轮（2026-10-26，零 LLM，$0）**：doctor 零 LLM 自检在干净树上只剩一条红——`dataset-check-cli` 探针仍要求 DL/DQ 之前的「通过（N 个任务）」文本，而 QuixBugs 现在输出「共加载 50 个任务」+「未提供 quality_report，跳过全量校验」；探针单测恰好 mock 了旧文本，套件全绿掩盖真树恒红（与 DU 的 QuixBugs 探针同族）。修法 = 与 workflow 侧同口径：接受「全量质量检查通过」或「未提供 quality_report」两种质量结论（缺失即红），加载数改从「共加载 N 个任务」读取，<41 仍 skip；证据键 `checked_tasks` 更名 `loaded_tasks`（质量检查未发生，不能宣称「检查 N 个任务」）。真树 `main.py doctor` rc=0（55 pass / 0 fail / 12 个 LLM 探针 skip + 1 个能力 skip，29.1s）。预登记跑 13,090 passed / 1 failed / 257 skipped、collected 13,348、163.85s / rc=1（唯一红 = 基线守卫）；刷新后 ⇒ 13,091。覆盖率行 19,678/20,189 = 97.4689%（未覆盖 511，较 DU 少 1 行）、分支 7,238/7,666 = 94.4169%（缺弧 428，较 DU 少 1 弧）——本轮 `src/` 零改动，两项移动都落在既有 ±2 抖动带内，不读作本轮收益。三次终跑 `make gates` 全绿（13,091 passed / 0 failed / 257 skipped，均 rc=0；链内 pytest 145.11s / 140.85s / 143.18s，warnings 34 / 39 / 42，链墙钟 246s / 163s / 165s），取第三跑 143.18s 记为 `suite_seconds: 143`；回填后验证跑 rc=0（136.83s / 38 warnings、链墙钟 151s，同一 collected 13,348，全链全绿）。**DU 轮（2026-10-26，零 LLM，$0）**：`check-dataset` 查出加载问题却仍以 0 退出——命令 docstring 承诺「0 = 无问题」，CI 与脚本会把「校验出问题」读成「数据集健康」；预登记跑还暴露一条 DQ 旧语义锁把「质量报告非空」写死成 rc=0（旧测试锁住的正是缺陷本身，已按新语义改写为 rc=1，图标单一来源断言保留）。修法 = `_print_quality_report` 单次调用并返回报告（缺失能力返回 None），报告非空时逐项列出后以 1 退出（与加载异常同码、文案可区分）；能力缺失与 `tasks_missing_source` 仍为披露、不计失败。QuixBugs e2e 探针同步改为接受「经校验通过 / 显式跳过」两种质量结论，真树实测 `status=pass, quality_verdict=skipped`（改前该探针在真树报假失败）。新增 11 例 DU 锁 + 2 例探针锁（净增 13）。预登记跑 13,083 passed / 4 failed / 257 skipped、collected 13,344、149.93s / rc=2；改写 DQ 旧语义锁并按 ruff 重排后，终树 `make test-cov` 全绿：13,087 passed / 0 failed / 257 skipped、collected 13,344、148.27s / rc=0（覆盖率读数取自该跑）。三次终跑 `make gates` 全绿（13,087 passed / 0 failed / 257 skipped，均 rc=0；链内 pytest 148.36s / 45 warnings、149.79s / 15 warnings、140.46s / 29 warnings，链墙钟 245s / 166s / 155s），取第三跑记为 `suite_seconds: 140`；回填后验证跑 rc=0（150.71s / 33 warnings、链墙钟 166s，同一 collected 13,344，全链全绿）。`ruff format` 1024 份（口径修正：`docs/superpowers/` 2 份智能体内部计划稿纳入忽略，ruff 不再扫描）；覆盖率行 19,677/20,189 = 97.4640%、分支 7,237/7,666 = 94.4039%。**DT 轮（2026-10-26，零 LLM，$0）**：doctor 的 JSON 报告在失败路径换了一套 schema——`_doctor_build_report` 内部异常时只输出 `schema/ok/error/exit_code` 4 个键，而成功与用法错误都输出 12 个；`jq -e '.conclusion == "pass"'` 在崩溃时不是判假而是取不到键，成功报告又缺 `error`，消费方仍要按「键是否存在」分支。修法 = 三条出口共用单一构造点 `_doctor_report`（13 键），崩溃时 `matrix.status` 记 `internal`、未采集的 `checks` / `check_summary` / 矩阵聚合记 `null`（未知 ≠ 全 0）、脱敏原因进 `error`、保留 `command` / `python` / `strict` 上下文并以 1 退出；新增 13 例测试锁（`tests/test_doctor_json_schema_dt.py`），先红后绿。预登记跑 **13,071 passed / 3 failed / 257 skipped、collected 13,331、149.89s / rc=2**（三红全为登记前状态锁：基线守卫 + `test_registration_readers_cf.py` 真树两例，登记落盘后转绿 ⇒ 13,074）；覆盖率 **19,673/20,185 行 = 97.4635%**（缺 512）/ **7,235/7,664 弧 = 94.4024%**（缺 429），`ruff format --check .` **1025 files already formatted**；三次终跑 `make gates` 全绿（链内 pytest 153.91s / 50 warnings、150.75s / 83 warnings、154.73s / 31 warnings，链墙钟 239s / 172s / 175s；取第三跑 154.73s），回填后验证跑 rc=0（151.26s / 37 warnings、链墙钟 236s，同一 collected 13,331，全链全绿）。此前 **DS 轮（2026-10-26，零 LLM，$0）**：崩溃任务的结果面与成功路径不同构——源文件非 UTF-8 / 工作流异常等崩溃只在结果流留下 `success/file/func/passed/error` 5 个键，成功结果有 14 个；`jq '.coverage_ok'` 在崩溃任务上取不到键（文档承诺 `--json` 逐任务结果含 `coverage_ok`），人读模式只打印 `✗ … coverage=N/A 迭代 0`、原因只进 `aitester.log`（迭代 0 是缺键兜底，不是真实值）。修法 = 两条路径共用全部键（未知判定显式 `null`、CLI 阈值与迭代上限照实透传、成功结果也带 `error: null`），非 `--json` 模式把脱敏后的原因写 stderr、迭代列显示 `N/A`；新增 9 例测试锁（`tests/test_cli_error_result_schema_ds.py`），旧锁 3 处按新契约加强/改写，先红后绿。预登记跑 **13,055 passed / 6 failed / 257 skipped、collected 13,318、141.33s / rc=2**（六红 = 3 登记前状态锁〔基线守卫 + `test_registration_readers_cf.py` 真树两例〕+ 3 状态通道棘轮锁〔update dict 45→47 键 / 95→99 站点、未触及 35→34、未审计 44→46——崩溃结果 dict 的 `coverage_threshold` / `max_iterations` 与状态通道声明键撞名，属「普通 dict 与状态更新同形」的已知噪声，按棘轮重登记〕；重登记后 3 红转绿 ⇒ 13,058，刷新本文件后全部转绿 ⇒ 13,061）；覆盖率 **19,664/20,176 行 = 97.4623%**（缺 512；`src/cli/` 两文件改动 ⇒ 非继承态，相对 DR 分母 +3 / 覆盖 +3，未覆盖与 DR 逐位相同）/ **7,233/7,662 弧 = 94.4009%**（缺 429，与 DR 逐位相同），`ruff format --check .` **1024 files already formatted**；三次终跑 `make gates` 全绿（13,061 passed 