flag_effect:                 # CH 轮（2026-10-24）新增节：`scripts/gates/check_flag_effect.py` 的 9 个声明键
  # 权威 = 本门就地复算（`make flag-effect`）；登记面 = 登记册 §1「开关有效性（CH 轮）」行，两侧逐项对账，缺键即红。
