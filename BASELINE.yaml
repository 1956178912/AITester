static_checks:
  ruff_version: "0.16.3"     # 与 CI 固定版本一致（requirements.lock）
  ruff_warnings: 0
  mypy_errors: 0
  mypy_source_files: 105     # 2026-10-05 W 批次实测：mypy src/ config.py 105 源文件 0 错误（+1 = 新增 src/datasets/dataset_realbugs.py）；CI mypy 与 pre-commit 均锁 1.15.0

python_ci_matrix: ["3.12", "3.13", "3.14"]   # CI 矩阵（scipy>=3.12 为下限）

error_categories: 18         # ErrorCategory 当前类别数（18 类，2026-10-01 独立审查 N6 更正：此前误记 17，实跑枚举为 18）

synthetic_templates: 50      # P0-5（2026-10-05 V 批次）：唯一缺陷 pattern 总数（30→50；scripts/verify_synthetic_templates.py 三重不变量全库自验证 50/50 通过——buggy 可检出 + fixed 自洽 + 测试数口径无漂移；6 个存量模板的 gold 材料缺陷已修复）

# O30（D.4-7 修复）：benchmark 节——承载当前有效的主实验指标，
# 守卫脚本 check_baseline_numbers.py 校验文档引用与本节一致性。
# 新工件落地后（run_benchmark.py 产出含 detection_rate 的批次）刷新本节点。
benchmark:
  # M1（2026-09-29 审查 P0）：三指标口径（替代旧 success_rate 单一指标）
  #   detection_rate  = 生成测试在已知缺陷代码上变红的比例（fail-to-pass 三段判定：
  #                     buggy 红 + fixed 绿 + 无收集/语法错误；2026-10-01 R1 修正）
  #   repair_rate     = 补丁应用后独立测试判定修复正确的比例
  #   false_fix_rate  = 测试通过但源码未变 / 补丁仅改测试的比例
  # 2026-10-01 独立审查 R42/R52/R53 增补：test_error_rate（坏测试直接防线）/
  # oracle_type + test_visible_to_system（APR 严谨性检查点 #2）/
  # patch_plausible + patch_correct + patch_precision（过拟合度量）/
  # source_patched_unverified + patch_evidence_level（R33 源码腐蚀风险观测）/
  # fl_at_k（R8 Ochiai FL@1/3/5 定位质量）/
  # A-01（2026-10-04 系统审查 P0）：spec_compile_rate（SpecIR v2 可编译规约占比，
  #   "逻辑驱动"主张的可测量内核；SPEC_IR_DSL_ENABLE=true 启用，默认关）
  # A-03（2026-10-04 系统审查 P0）：patch_rollback_verdict + patch_rolled_back
  #   （快照/P2P 全量回归/失败自动回滚协议观测；PATCH_SNAPSHOT_ROLLBACK_ENABLE=true
  #   启用，默认关；regression_failed 时自动回滚 target_code 到快照原文；
  #   PATCH_ROLLBACK_FAIL_CLOSED=true 时 rc>=2/超时/IO 异常口径也触发回滚）
  # R1c（2026-10-05 审查 P0）：spec_oracle_injected（确定性规约 oracle 注入
  #   观测；SPEC_ORACLE_EXEC_ENABLE=true 启用，默认关——compile_spec_oracle
  #   产物与 LLM 测试并列执行，"逻辑驱动"通道的确定性检出）
  # R5（2026-10-05 审查 P0）：mutation_detection_rate / mutants_killed /
  #   mutants_total（生成测试对 gold fixed 的 AST 变异体检出比例——测试
  #   有效性的客观裁决，SWE-Mutation 2026 口径；ENABLE_MUTATION_SCORING=true
  #   时 run_benchmark 逐基线写入结果行，默认关）
  metrics_schema:
    [detection_rate, repair_rate, false_fix_rate, regression_rate, test_error_rate,
     oracle_type, test_visible_to_system, patch_plausible, patch_correct,
     patch_precision, source_patched_unverified, patch_evidence_level, fl_at_k,
     spec_compile_rate, patch_rollback_verdict, patch_rolled_back,
     mutation_detection_rate, mutants_killed, mutants_total]
  current_main_batch: "experiments/results/main_batch/benchmark_synthetic_20261001_121523.json"
  # 2026-10-01 独立审查 R4 落地：固定 seed 42 / n=50 主批次已产出（R4 可复现
  # 主批次 + provenance 块 + R14 统计协议）。数字与工件路径：
  #   aitester: success=90.0% (45/50)，M1 三指标可测 49/50（1 个跨文件任务
  #     无单文件 gold 材料，保守 None）；detection=2.0% / repair=0.0% /
  #     false_fix=89.8%（历史"假成功"通道的直接证据）
  #   plain_llm: success=52.0% (26/50)
  #   single_agent: success=0.0% (0/50)，test_error_rate=94%
  #   2026-10-05 独立审查 P0（统计口径修正）：passed 为自指指标（自产测试在
  #     未修复代码上通过），McNemar p=0.0001（χ²=15.0417，不一致对 24，BH-FDR
  #     显著）**仅作诊断参考**；首要结论口径为诚实指标 McNemar（gold 独立裁决）：
  #     detection aitester vs plain_llm = 2.0% vs 2.0%（不一致对 2，p=0.4795
  #     不显著）/ repair = 0.0% vs 0.0%（不一致对 0，p=1.0）——诚实指标下
  #     完整系统与简化基线无显著差异。统计报告（含诚实指标节与复算命令）：
  #     experiments/results/main_batch/statistical_report.md
  #   X2（2026-10-05 第七轮审查 P0-4b）：统计加载默认剔除"M1 指标未计算"
  #     批次（无任何非 None detection_rate 行——main_batch 目录的 2 个
  #     n=5 冒烟批次 112528/112801 属此类）。此前报告"60 任务/可测 49"
  #     为冒烟批次混入分母的口径缺陷；剔除后数据概览收敛为 50/50/50，
  #     与本节历史引用数字（52.0% (26/50) 等）逐位一致。历史混批口径
  #     可经 --allow-schema-mixed 显式恢复。统计管线批次去重排序主键 =
  #     文件名内嵌时间戳（实验属性，跨机可复算），mtime 为无内嵌时间戳
  #     批次的兜底；本节数值由 statistical_analysis.py 从入库工件逐位复现。
  # 历史批次（仅存档，不作当前口径引用）：
  history:
    - batch: "experiments/results/benchmark_synthetic_20260925_135638.json"
      metric: "success_rate (旧口径，含 65.9% 假成功)"
      note: "已被 M1 三指标口径取代；数字 88% vs 60% vs 8% 存于旧批次 JSON（未入库）"
