    symptom: "O 轮现场发现 ppid=1、99% CPU、龄期 82min 的孤儿 pytest（QuixBugs 非终止家族让 branch 测量子进程永久挂起；父进程被外部杀死后未回收，M-3 父死亡缺口族）"
    fix: "src/tools/branch_coverage_inject.py：测量子进程内 pytest 单测 10s 超时（pytest-timeout，插件缺失自动降级）+ 调用点 run_with_timeout(orphan_guard=True)；外层 60s 超时不变"
    evidence: "tests/test_o_round_branch_coverage_hygiene.py（7 例：静态锁/传参/orphan_guard/超时降级/死循环有界 11.5s）"
  repo_stale_bytecode:
    symptom: "executor-repo-verify 随机假红 6/15：baseline 与 llm_patch 两阶段 1s 内写入同尺寸源码 → CPython pyc 头 (mtime 整秒,size) 不变 → 第二轮复用 baseline 字节码（'补丁已应用却仍失败'）"
    fix: "src/agents/executor_repo.py：唯一 pytest 咽喉点加 -B + PYTHONDONTWRITEBYTECODE=1（env 可传播到子进程），根除 mtime 粒度竞态；CI/Makefile 侧 sitecustomize 规避保留为双保险"
    evidence: "tests/test_o_round_repo_bytecode.py（3 例：-B/env 契约、repo 内不产 __pycache__、同秒同尺寸改写读到新源码）"
  oracle_all_skip_verdict:
    symptom: "oracle 执行体全 skip 时套件 passed=True → nodes 行级 verdict 可能误升 injected_and_passed（与独立判读 unavailable 冲突）"
    fix: "src/graph/nodes.py：输出显式出现 oracle SKIPPED 行 → 保留未决态 injected（不臆测 passed）；正常 passed/failed 三态不变"
    evidence: "tests/test_oracle_instrument_safety.py +3 例（全 skip/正常 passed/失败检出）"

  stagnation_wiring:  # P-2（2026-10-18）：A-19 覆盖率停滞检测从"纸面功能"修成真提前停止
    symptom: "COVERAGE_STALL 只被 determine_stop_reason 使用（且位于 MAX_ITERATIONS 之后 → 标签被遮蔽），全仓无路由消费点；开关存在但无行为（O 轮 N-4 D1 同类）"
    fix: "_should_debug / _route_after_diagnosis 在进入 debugger 前短路消费停滞判定（trace done/stop_reason=coverage_stall/return done，不抢占既有分支）；determine_stop_reason 停滞分支前移至 MAX_ITERATIONS 之前（OFF 历史标签逐位不变）"
    evidence: "commit aeadb7b；tests/test_p_round_stagnation_wiring.py（26 例）；零 LLM 前后：修前 _should_debug=debug / at-max=max_iterations → 修后 done+coverage_stall / at-max=coverage_stall，OFF 不变"
    ablation: "synthetic 10 任务/臂 fast 档：两臂 stall 触发=0、iterations=0（10/10 首轮全绿，从未进入 debugger）→ 结构性无触发，场景/功效限制；下一轮需保证 ≥2 轮失败的任务集"
  product_doctor:  # P-3（2026-10-18）：零 LLM 自检命令
    command: "python main.py doctor [--json] [--groups ...] [--timeout N] [--strict]"
    checks: "环境/配置 6 项（Python/可选依赖/LLM 端点数量（不输出值）/数据集缓存/内核沙箱能力/git HEAD+dirty）+ 零 LLM 功能矩阵子集（隔离 subprocess、强制剥除 AITESTER_E2E_LLM、--groups 透传、超时 fail-closed）"
    measured: "全量 21.45s：47 pass/0 fail/0 error/12 skip；--groups budget 1.39s；JSON schema aitester_doctor/1；凭证泄漏 0 次；退出码 fail/error→1，--strict warn/skip→1"
    tests: "tests/test_doctor_command.py（46 例）"
