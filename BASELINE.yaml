     mutation_detection_rate, mutants_killed, mutants_total,
     spec_expr_coverage, specificity_gate_verdict, red_regression_violation,
     fl_constraint_verdict, fl_constraint_hit_rank, fl_constraint_changed_functions,
     oracle_quality_history, self_repair_trap_suspected, self_repair_trap_signals]
  # R2 落地批次（2026-10-08）口径修正 v2：第三起测量伪影（跨文件任务未物化，
