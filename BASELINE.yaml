    code_analyzer: 89
    planner: 89
    dependency: 82
    multi_candidate: 84
    cross_file: 91
    rag_retriever: 86
  branch_total_pct: 79       # --cov=src --cov-branch 总分支覆盖（79.31%，2026-10-02 分支提档批次·五 + tree_sitter/dependency/multi_candidate/code_analyzer 补齐后实测，门禁 77% 绿）
