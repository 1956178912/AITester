    #       模板簇 k=29 ICC=0.671 DEFF=4.356 n_eff=39.9，符号检验 1:1 p=1.0000。
    #   E6 关键对比: McNemar χ²=16.962 BH-FDR q=0.0067；贝叶斯 δ=−0.2418
    #       CI [−0.3447,−0.1432]；聚类校正 χ²_adj=6.60、符号检验 1:12 p=0.0034
