  ruff_warnings: 0
  mypy_errors: 0
  mypy_source_files: 104     # 2026-10-05 V 批次实测：mypy src/ config.py 104 源文件 0 错误（无新增源文件——scripts/verify_synthetic_templates.py 不在 mypy 口径）；CI mypy 与 pre-commit 均锁 1.15.0

