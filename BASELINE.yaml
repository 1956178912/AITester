  declared_flags: 82         # 26 道门声明的 (门禁, 开关) 实例数——与 `invocation.declared_flags` 同数、两条独立复算，任一实现漏一条即两侧不等（DF 轮 +2）
  live_flags: 82             # `活`：dest 在声明行以外被显式读到的实例数（DF 轮 +2 = `check_dependency_audit.py` 的 `--require-audit` / `--list` 均被读；DB 轮 +2 ⇒ 78→80，DB 轮只刷了 `invocation` 节、漏了本键，DC 轮按本门复算收口）
  proxy_flags: 0             # `代理`：dest 从不被读，但与已读的兄弟同处 `required=True` 互斥组——当下等价、保证来自组而不是它自己，仍计红
  dead_flags: 0              # `死`：dest 在整个模块从不被读且无结构代理——传与不传都不改变行为（改前实测 dest 从不被读 **2** 条 = 死 1（`check_docs_history_drift --warn-only`）+ 代理 1（`checksum_results --verify`，等价性由 `required=True` 互斥组担保）；两条都是判据档、都真被 ci.yml 传上去，本轮逐个接了线）
  opaque_flags: 0            # `不可判`：整包读走 Namespace 的门里那些 dest 级判不出的实例（显式计红，绝不静默算成「活」）
  opaque_gates: 0            # 命中逃逸写法（`vars(args)` / `getattr(args, …)` / `**args.` / `args.__dict__` / `parse_known_args`）的门禁数
  me_groups: 1               # `required=True` 的互斥必填组数（`checksum_results` 的 `--write`/`--verify`；代理档的担保来源，逐组复算而非看开关名）
