# AITester 当前基线（机器可读单一事实来源）
#
# 用途：核心维护文档（README / QUICKSTART / api_reference / algorithm_design /
#       usage_examples）的"当前基线"数字统一引用本文件，避免多文档各自硬编码
#       造成漂移。历史版本表（CHANGELOG / api_reference 的版本演进节）记录
#       的是当时快照，不随本文件刷新——本文件只维护"当前"。
#
# 维护约定（见 CONTRIBUTING.md "文档组织约定"）：
#   - 任何功能批次落地后，必须同步更新本文件的 last_verified 与对应数字；
#   - 数字以全量 pytest / ruff / mypy 实测输出为准（CI 3.14 矩阵）；
#   - 过期内容不得就地标注在本文件，历史快照归 docs/history/。

version: "1"
last_verified: "2026-10-02"   # 全量回归实测日期（2026-10-02 分支提档批次·五：tree_sitter/dependency/multi_candidate/code_analyzer 补齐后 3330 全绿刷新）

