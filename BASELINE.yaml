# O-∞（R5 审查 2026-10-09，MET-01/EXP-01 收口）：**target_quality**——被测代码
# 侧的一等公民指标。此前这批数字**已采集在批次工件里但从未登记**，导致项目
# "测试生成系统"身份无法与 2025–2026 前沿（CoverUp 90% line+branch、
# TestAgent 88.85% line / 55.4% mutation、ULT 45.10% stmt / 40.21% mutation）
# 对话。本节由零 LLM 存量重放固化：
#   python -m experiments.target_quality_replay experiments/results/main_batch
# 产物：experiments/results/main_batch/target_quality_report.md（随批次入库）。
target_quality:
  # 口径纪律（与 repair_caliber_matrix.md §3 同）：引用须带批次 + 臂 + n；
  # 跨代际合计仅作描述性概览，**不是对外口径**。
  target_line_coverage_pct:  # 被测代码行覆盖率（results.<arm>.details[].coverage）
    # 观察：aitester 84.0–93.6%，**系统性低于** plain_llm 86.0–97.2%——
    # 与 detection 的 −28pp 同向，构成"完整系统覆盖率也更低"的第二条独立证据。
    aitester: [84.0, 93.6]   # 10 批次区间（n=87/批，2026-10-06/07）
