    # 批后挂死修复（2026-10-09，审查报告 §11.1b 结果十三）：QuixBugs 批次跑满
    #   50 任务后主线程卡死 selectors.select←subprocess._communicate←
    #   branch_coverage_inject.py:161（%CPU 0.0、30+ 分钟、批次 JSON 从未写出）。
    #   根因：subprocess.run(timeout=) 超时只 kill 直接子进程，孙进程继承管道
    #   写端 → communicate() 等 EOF 永久阻塞；EXECUTION_TIMEOUT(30s)/O3(60s)
    #   只覆盖"单个子进程执行"，不覆盖"超时后无法回收"。
    #   修复：新增 src/utils/process_utils.py::run_with_timeout
    #   （start_new_session 新进程组 + killpg 整树终止 + 有界收口 ≤5s +
    #    仍收不回则放弃读取并返回，保证不挂死），已接线 branch_coverage_inject。
    #   验证：12 个单元测试（含"孙进程持管道"敌意场景，原实现永久挂死；
    #   修复后 ~8s 返回且孙进程被终止）；真实 QuixBugs 单任务 411.4s 正常完成。
    batch_hang_fix:
      fix: "src/utils/process_utils.py::run_with_timeout"
      wired_into: "src/tools/branch_coverage_inject.py::measure_branch_coverage"
      root_cause: "subprocess.run(timeout) 只 kill 直接子进程；孙进程持管道 → communicate 永久阻塞"
      tests: 12
