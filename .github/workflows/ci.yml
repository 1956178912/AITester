name: AITester CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 矩阵与 requirements.txt 的锁定版本对齐（lock 生成自 Python 3.14 开发环境）：
        # - scipy==1.18.0 要求 >=3.12（下限）
        # - pandas==3.0.5 / matplotlib==3.11.1 要求 >=3.11
        # 3.10/3.11 无法安装当前锁定版本集（3.10 也即将 EOL），故矩阵收窄为 3.12（下限）+ 3.14（开发环境）
        python-version: ['3.12', '3.14']

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # requirements.txt 已含 pytest-cov/pytest-timeout 等测试依赖（版本锁定）
          pip install -r requirements.txt
          # ruff 为开发工具，不进 requirements（始终用最新版做 lint）
          pip install ruff

      - name: Check lock sync
        run: python scripts/check_lock_sync.py

      - name: Lint with ruff
        run: |
          ruff check .
          ruff format --check .

      - name: Run tests with coverage
        run: |
          pytest tests/ -v --cov=src --cov-report=xml --cov-report=term-missing
        env:
          # 使用测试用的 mock API key，避免真实调用
          LLM_1_API_KEY: test-key
          LLM_1_BASE_URL: https://test.example.com
          LLM_1_MODEL_NAME: test-model

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.14'
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Check dependencies for vulnerabilities
        # 说明：safety 工具已于 2024-06 起弃用 `check` 子命令（CI 上退出码 64），
        # 改用 PyPA 维护的 pip-audit。
        # 当前 chromadb==1.5.9 命中 4 条已知漏洞，但 PyPI 上暂无修复版本
        # （last_affected=1.5.9，为最新版），故显式忽略并在 CHANGELOG/决策日志记录；
        # 一旦发布修复版本，应升级并移除对应 --ignore-vuln。
        run: |
          pip-audit -r requirements.txt --no-deps \
            --ignore-vuln PYSEC-2026-311 \
            --ignore-vuln CVE-2026-45830 \
            --ignore-vuln CVE-2026-45831 \
            --ignore-vuln CVE-2026-45833
