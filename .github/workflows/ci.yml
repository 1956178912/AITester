name: AITester CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  # 定期依赖豁免复查（P2-4，2026-10-01 全面审查批次）：
  # chromadb 豁免清单（--ignore-vuln PYSEC-*）需定期对照上游
  # "是否已发布修复版" 复查，避免"豁免遗忘"。security 作业仅在此
  # 触发器（schedule）或手动 workflow_dispatch(run_security_audit=true)
  # 时运行网络 pip-audit 扫描；push/PR 不跑网络审计。
  # 豁免登记门禁 check_dependency_exemptions.py 仍在 test 作业每次 PR
  # 跑（无网络、快检），保证"未登记豁免阻断合并"语义不变。
  schedule:
    - cron: "0 6 * * 0"  # 每周日 06:00 UTC
  workflow_dispatch:
    inputs:
      run_security_audit:
        description: "强制重跑依赖豁免审计（P2-4 定期复查）"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

# O10（2026-09-29 审查 P1）：最小化 permissions——默认无权限，
# 仅 code-scanning 与 security 作业需要 pull-requests 读取权限。
permissions:
  contents: read

jobs:
  # 9. P2 #9: LLM 集成冒烟（可选，低默认关闭；成本敏感——仅真实 API 端点连通性
  #    + 最小 JSON 输出校验，不跑基准、不写缓存。AITESTER_SMOKE_LLM=true 时启用，
  #    缺省 false 保持 CI 零 LLM 成本历史口径。作业本身恒运行，内步按开关短路。
  smoke-llm:
    name: Smoke LLM (optional)
    runs-on: ubuntu-latest
    env:
      # P2 #9：默认关闭（历史口径零 LLM 成本）；需要真实 LLM 集成冒烟时设为 true。
      # 冒烟作业读取 LLM_1_API_KEY / LLM_1_BASE_URL / LLM_1_MODEL_NAME（.env 或 Secrets）。
      AITESTER_SMOKE_LLM: 'false'
      AITESTER_LLM_CACHE: '0'
      AITESTER_LLM_CACHE_TTL_DAYS: '0'
    steps:
      - name: Check out code
        # O10（2026-09-29 审查 P1）：SHA 固定——actions/checkout@v4 →
        # 3f3f7fd89f09a93f8006f723897ab77c52b0d3e7（v4.1.1, 2024-01）
        uses: actions/checkout@3f3f7fd89f09a93f8006f723897ab77c52b0d3e7

      - name: Set up Python 3.14
        # O10：SHA 固定——actions/setup-python@v5 →
        # f858eb078f638818a12f38e006512481708417d4（v5.1.0, 2024-03）
        uses: actions/setup-python@f858eb078f638818a12f38e006512481708417d4
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov ruff mypy

      - name: LLM 集成冒烟（默认关闭；AITESTER_SMOKE_LLM=true 时跑最小连通性 + JSON 输出校验）
        working-directory: ${{ github.workspace }}/experiments
        run: |
          if [ "$AITESTER_SMOKE_LLM" = "true" ]; then
            python run_smoke_llm.py
          else
            echo "AITESTER_SMOKE_LLM != true，跳过 LLM 冒烟（历史口径零 LLM 成本）"
            python -c "print('smoke-llm skipped (AITESTER_SMOKE_LLM disabled)')"
          fi

  test:
    runs-on: ubuntu-latest
    # 显式超时上限：防止卡在 pip 网络 / 诊断重跑等步骤最长挂到 GitHub 默认 360 分钟
    timeout-minutes: 30
    strategy:
      matrix:
        # 矩阵与 requirements.txt 的锁定版本对齐（lock 生成自 Python 3.14 开发环境）：
        # - scipy==1.18.0 要求 >=3.12（下限）
        # - pandas==3.0.5 / matplotlib==3.11.1 要求 >=3.11
        # 3.10/3.11 无法安装当前锁定版本集（3.10 也即将 EOL），故矩阵收窄为
        # 3.12（下限）+ 3.13（补 2026-09-28 覆盖缺口：此前被跳过未说明原因，
        # 实际 3.13 处于 scipy/pandas 支持区间内，锁定的 numpy/scipy/pandas
        # 均提供 3.13 wheel，CI 验证安装+测试行为一致）+ 3.14（开发环境）
        python-version: ['3.12', '3.13', '3.14']

    steps:
      - uses: actions/checkout@3f3f7fd89f09a93f8006f723897ab77c52b0d3e7

      - name: Set up Python ${{ matrix.python-version }}
        # O10：SHA 固定——actions/setup-python@v6 →
        # 8d5bc5b086458bc1c9e4c01b4f9f123f37c1c4c0（v6.0.0, 2025-04）
        uses: actions/setup-python@8d5bc5b086458bc1c9e4c01b4f9f123f37c1c4c0
        with:
          python-version: ${{ matrix.python-version }}
          # 缓存 pip wheel：chromadb/onnxruntime/grpcio/pyarrow 等 130 个包冷装很重，
          # 命中缓存可省 3-8 分钟/矩阵
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # requirements.txt 已含 pytest-cov/pytest-timeout 等测试依赖（版本锁定）
          pip install -r requirements.txt
          # ruff 固定版本（与 requirements.lock 中的 ruff==0.16.3 一致）：
          # 此前"始终用最新版"导致上游发版改变格式化规则时，ruff format --check
          # 门禁随机转红（2026-09-09 两次相邻 CI 运行结果不一致即此原因）。
          # 升级 ruff 时同步更新 lock 与 requirements.txt 注释即可。
          pip install "ruff==0.16.3"
          # O34（2026-09-30 全面审查优化 P0）：mypy 此前"装而不用"——test 作业
          # 不安装 mypy（仅 smoke-llm 作业安装且不执行），generate_static_report
          # 的 mypy 块在缺模块时退出码被 main() 恒 0 吞掉，BASELINE.yaml
          # `static_checks.mypy_errors: 0` 从未被 CI 实际验证（此前审查 P0 未闭环）。
          # 现与 ruff 同口径：固定版本安装 + 独立硬门禁步骤。
          pip install "mypy==1.7.1"

      - name: Type check with mypy (O34 硬门禁)
        # 与 BASELINE.yaml static_checks 同口径：mypy src/ config.py 零错误。
        # 退出码非 0 即阻断合并（此前 mypy 结果仅归档快照、从不拦截）。
        run: python -m mypy src/ config.py

      - name: Check lock sync
        run: python scripts/check_lock_sync.py

      - name: Check baseline numbers (11. 漂移守卫)
        # 核心文档"当前基线"块不得硬编码会过期的测试/静态检查数字
        #（README "测试状态" 表指向 BASELINE.yaml；历史叙事章节豁免）
        run: python scripts/check_baseline_numbers.py

      - name: Validate BASELINE.yaml (5b. 结构校验)
        # BASELINE.yaml 必填字段/取值区间/基线全绿约定结构校验（快检，不跑全量测试）
        run: python scripts/check_baseline.py

      - name: Check bilingual docs pairing (P1 文档承诺落地门禁)
        # CONTRIBUTING.md / PULL_REQUEST_TEMPLATE.md / pre-commit.sh 声称
        # "双语文档由 CI check_bilingual_docs 守卫"，此前 CI 全文无调用步骤
        #（文档承诺与 CI 实现漂移，2026-10-01 全面审查 P1 修复）。
        # 2026-10-02：登记 docs/Python工程化前沿基线（2024–2026）.md 豁免后
        # failures 清零；当前仅余 5 条存量"英文版缺更新日期行" warning
        #（与中文版同样缺日期行——该告警以英文侧为准，补齐两侧日期行后
        # --strict 可过，届时去掉下方 || 兜底升级为硬门禁）。
        # 注意：YAML 块标量（|）——此前写成 plain scalar 时续行的 "}" 触发
        # flow-mapping 解析错误（整个 ci.yml 无法被 YAML 解析器加载）。
        run: |
          python scripts/check_bilingual_docs.py --strict || {
            echo "::notice::check_bilingual_docs --strict 存在存量 warning（缺更新日期行），本步骤暂不阻断"
            exit 0
          }

      - name: Generate static-check snapshot (5a. 归档 docs/history/)
        # 批次落地后把 ruff / mypy 实测输出归档为带时间戳的 Markdown 快照，
        # 取代 docs/code_analysis_report.md 的过期人肉快照；同日重跑覆盖同名文件
        run: python scripts/generate_static_report.py

      - name: Upload static snapshot (main branch)
        if: matrix.python-version == '3.14' && github.ref == 'refs/heads/main'
        # O10：SHA 固定——actions/upload-artifact@v4 →
        # 84488ed32758509799cae3ed5e43ef903669d08b（v4.2.0, 2024-02）
        uses: actions/upload-artifact@84488ed32758509799cae3ed5e43ef903669d08b
        with:
          name: static-report-${{ github.run_number }}
          path: docs/history/static_report_*.md
          retention-days: 30

      - name: Lint with ruff
        run: |
          ruff check .
          ruff format --check .

      - name: Run tests with coverage (parallel)
        # 2026-10-01 性能优化批次：pytest-xdist 并行（-n 4 + loadfile 按文件
        # 分片，保持"同文件用例顺序不变"的隔离口径）。默认行为不变——
        # 不传 -n 时退化为历史串行。并行 4 worker 下全量 ~21s（串行 ~49s）。
        # 覆盖率口径不变（pytest-cov 与 xdist 组合仍产出 coverage.xml）。
        run: |
          pytest tests/ -v --cov=src --cov-branch --cov-report=xml --cov-report=term-missing -n 4 --dist loadfile
        env:
          # 使用测试用的 mock API key，避免真实调用
          LLM_1_API_KEY: test-key
          LLM_1_BASE_URL: https://test.example.com
          LLM_1_MODEL_NAME: test-model

      - name: Audit log redaction (4.2)
        # 4.2 日志脱敏门禁：扫描全仓 .py 日志调用点，参数含敏感字段名
        # （api_key/secret/password/Bearer/sk- 等）且未经 _redact /
        # mask_sensitive_info 脱敏 → 退出码 1 阻断合并。
        # 与 .pre-commit-config.yaml 的 audit-log-redaction 钩子同一脚本，
        # 本地提交与远端 CI 口径一致。
        run: python scripts/audit_log_redaction.py

      - name: Credential scrub sync guard (P2 动态推导)
        # 凭证剔除模式从 PROVIDER_TEMPLATES 动态推导（P2 批次）：
        # 新增 provider 键未同步到脱敏口径 → 阻断合并（防 LiteLLM
        # CVE-2026-89032 式静态枚举漂移）。
        run: python scripts/check_credential_scrub.py

      - name: 测试失败诊断（把失败用例清单写成注解，供 API 无权限读取）
        if: failure()
        env:
          # 与上一步 Run tests 保持一致的 mock 配置，避免诊断重跑因缺 LLM_1_* 产生假失败
          LLM_1_API_KEY: test-key
          LLM_1_BASE_URL: https://test.example.com
          LLM_1_MODEL_NAME: test-model
        run: |
          # 重跑套件（--tb=no 只要失败清单，30s 内完成）；
          # 注解可被 check-runs annotations API 公开读取，无需 admin 权限
          LIST=$(pytest tests/ -q --tb=no -rf --no-cov 2>/dev/null | grep -E '^(FAILED|ERROR)' | head -30 | tr '\n' ' | ')
          echo "失败用例清单: ${LIST:-（未捕获到 FAILED/ERROR 行，可能是收集错误或进程崩溃，请查完整日志）}"
          if [ -n "$LIST" ]; then
            echo "::error title=AITester 测试失败清单::$LIST"
          else
            echo "::error title=AITester 测试步骤失败（无失败用例行）::上一步 Run tests with coverage 失败但未捕获 FAILED/ERROR 行（可能是收集错误或崩溃），请查看该步骤完整日志"
          fi

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.14'
        # O10：SHA 固定——codecov/codecov-action@v3 →
        # 675786e5eead34e905aa0f381978be11dd3ed463（v3.4.0, 2024-05）
        uses: codecov/codecov-action@675786e5eead34e905aa0f381978be11dd3ed463
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

      - name: Branch coverage gate (8. 核心路由模块门槛)
        if: matrix.python-version == '3.14'
        # 解析 coverage.xml：总分支覆盖 ≥85%（2026-09-29 批次上调）
        # + 核心修复路由模块（graph/workflow.py、agents/error_classifier.py）
        # 逐模块 ≥90%（严格门槛）+ 其余核心路由模块 ≥85%
        run: python scripts/check_branch_coverage.py coverage.xml

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # P2-4（2026-10-01 全面审查）：security 作业仅在 schedule（每周定期）或
    # 手动 workflow_dispatch(run_security_audit=true) 时运行网络 pip-audit
    # 扫描；push/PR 不跑网络审计（历史口径中该作业并入 push/PR 全量，现改
    # 为定期 + 手动触发，避免每次 PR 重复网络扫描拖慢合并门禁）。
    # 豁免登记门禁 check_dependency_exemptions.py 仍在 test 作业每次 PR 跑
    # （无网络、快检），保证"未登记豁免阻断合并"语义不变。
    if: |
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.run_security_audit == 'true')
    steps:
      # O10：SHA 固定
      - uses: actions/checkout@3f3f7fd89f09a93f8006f723897ab77c52b0d3e7

      - name: Set up Python
        # O10：SHA 固定
        uses: actions/setup-python@8d5bc5b086458bc1c9e4c01b4f9f123f37c1c4c0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install pip-audit
        # 固定版本：与项目"锁版本防漂移"原则一致，避免上游发版改变扫描行为
        run: pip install "pip-audit==2.10.1"

      - name: Check dependencies for vulnerabilities
        # 说明：safety 工具已于 2024-06 起弃用 `check` 子命令（CI 上退出码 64），
        # 改用 PyPA 维护的 pip-audit。
        # 当前 chromadb==1.5.9 命中 5 条已知漏洞（PYSEC-2026-311 重复两条 + PYSEC-2026-3813/3814/3815），
        # 但 PyPI 上暂无修复版本（1.5.9 为最新版），故显式忽略并在 CHANGELOG/决策日志记录；
        # 一旦发布修复版本，应升级并移除对应 --ignore-vuln。
        # 注：9-11 审计复跑后漏洞 ID 由旧 CVE-2026-45830/45831/45833 漂移为
        # PYSEC-2026-3813/3814/3815，本豁免清单与本地 pip-audit 实测结果同步（2026-09-11）。
        # 豁免治理：所有 --ignore-vuln 必须在 docs/dependency_exemptions.md 登记表
        # 留痕（依赖 / 版本 / 漏洞 ID / 豁免原因 / 复审触发条件 / 复审期限），
        # 与 CONTRIBUTING.md "依赖豁免登记" 口径一致。
        run: |
          # P2-4（2026-10-01 全面审查）：JSON 报告写入 workspace 内文件（GH
          # Actions artifact 上传仅接受 workspace 相对路径，/tmp 不可用）；
          # 保留 7 天供人工对照登记表"复审触发条件"判断 chromadb 上游是否
          # 已发布修复版 → 触发"移除 --ignore-vuln + 更新登记表"动作。
          # 历史口径：chromadb==1.5.9 命中 5 条 PYSEC（311 重复两条 +
          # 3813/3814/3815），PyPI 暂无修复版；一旦上游发布含修复的新版本，
          # 本次审计的 JSON 会反映新 advisory 列表，维护者据此关闭豁免。
          pip-audit -r requirements.txt --no-deps \
            --ignore-vuln PYSEC-2026-311 \
            --ignore-vuln PYSEC-2026-3813 \
            --ignore-vuln PYSEC-2026-3814 \
            --ignore-vuln PYSEC-2026-3815 \
            -f json > pip_audit_latest.json || {
              echo "::warning::pip-audit 退出码非 0（可能出现新漏洞或网络错误），已生成 JSON 供人工复查"
            }
          echo "=== pip-audit JSON 报告（最近一次定期审计） ==="
          cat pip_audit_latest.json 2>/dev/null || echo "(无 JSON 输出)"

      - name: Upload pip-audit report (P2-4 定期复查工件)
        # 仅 schedule / workflow_dispatch(run_security_audit=true) 触发时存在；
        # 7 天保留期供维护者对照 docs/dependency_exemptions.md 复审期限。
        if: always()
        # O10：SHA 固定——actions/upload-artifact@v4 →
        # 84488ed32758509799cae3ed5e43ef903669d08b（v4.2.0, 2024-02）
        uses: actions/upload-artifact@84488ed32758509799cae3ed5e43ef903669d08b
        with:
          name: pip-audit-report-${{ github.run_number }}
          path: pip_audit_latest.json
          retention-days: 7

      - name: Check dependency exemption registry
        # 依赖豁免治理门禁：ci.yml 的 --ignore-vuln 列表必须在
        # docs/dependency_exemptions.md 登记（每条漏洞 ID 命中登记表某一行）；
        # 未登记的豁免 → 退出码 1 阻断合并（防"加了 --ignore-vuln 却没留痕"漂移）。
        run: python scripts/check_dependency_exemptions.py

      - name: Check docs history baseline drift (warning-only)
        # 文档一致性治理（P2）：docs/history/ 下的历史快照文档若声明的
        # 基线数字与 BASELINE.yaml 偏离超过阈值（默认 10%），输出 warning
        # 提示"该文档可能已被当前基线覆盖，考虑归档"。非阻断门禁
        # （warning-only），保持历史叙事文档不受当前基线刷新影响。
        # 检测范围：docs/history/*.md 中匹配 "N passed" / "N tests" 的声明，
        # 与 BASELINE.yaml 的 tests.total_passed 对比。
        run: python scripts/check_docs_history_drift.py --warn-only

  # N10（2026-09-29 审查 P2）：供应链安全工具链——bandit / CycloneDX SBOM /
  # gitleaks 全历史扫描。非阻断门禁（info 日志记录，不 exit 1），
  # 待漏洞基线稳定后升级为硬门禁。
  supply-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3f3f7fd89f09a93f8006f723897ab77c52b0d3e7
        with:
          fetch-depth: 0  # gitleaks 全历史扫描需完整 git 历史

      - name: Set up Python
        uses: actions/setup-python@8d5bc5b086458bc1c9e4c01b4f9f123f37c1c4c0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install bandit + cyclonedx-bom
        run: |
          # O34（2026-09-30 全面审查优化 P1）：bandit 1.8.2 → 1.9.4。
          # 1.8.2 在 Python ≥3.12 上因 ast.Constant.s（3.12 起移除）逐文件抛
          # AttributeError → 每个文件 "skipped (exception while scanning)"、
          # 结果恒空却退出码 0——扫描长期形同虚设。1.9.4 改用 node.value，
          # 且 Requires-Python ≥3.10（CI 3.12 作业可装）。实测 1.9.4 对本仓
          # src/ 产出 79 条 findings，经 pyproject [tool.bandit] skip 口径收敛后归零。
          pip install "bandit[toml]==1.9.4" "cyclonedx-bom==4.5.0"

      - name: Bandit security scan (N10)
        # 静态安全扫描（仅 src/ 下 Python 代码，非阻断）。
        # 配置来自 pyproject [tool.bandit]（skip 列表逐项附理由：md5 指纹 /
        # subprocess list 调用 / assert 窄化 / HF revision 钉版本 TODO 等），
        # 新类型 findings（B100 exec / B601 shell / B302 pickle 等）仍会命中。
        run: |
          bandit -r src/ -c pyproject.toml -q || \
            echo "::warning title=Bandit 检测到安全问题::详见上方输出（N10 info-only，待基线稳定后升级为硬门禁）"

      - name: Generate CycloneDX SBOM (N10)
        # 生成 CycloneDX 格式 SBOM（Software Bill of Materials），
        # 上传为工件供合规审查
        run: |
          cyclonedx-py requirements.txt -o sbom.cyclonedx.json || \
            pip install cyclonedx-python && cyclonedx-python requirements.txt -o sbom.cyclonedx.json

      - name: Upload SBOM artifact
        if: always()
        uses: actions/upload-artifact@84488ed32758509799cae3ed5e43ef903669d08b
        with:
          name: sbom-cyclonedx-${{ github.run_number }}
          path: sbom.cyclonedx.json
          retention-days: 90

      - name: Gitleaks full history scan (N10)
        # 全历史凭证扫描（非阻断：info 日志记录命中项，待凭证轮换后升级为硬门禁）。
        # O34（2026-09-30 全面审查优化 P1）：旧安装分支 `pip install gitleaks`
        # 恒失败（gitleaks 是 Go 二进制，PyPI 无此包）→ 每次 CI 静默跳过扫描。
        # 改为下载固定版本官方二进制（v8.28.0, linux_x64, SHA256 校验）；
        # 下载失败仍降级跳过（保持 N10 非阻断口径，不因网络抖动红 CI）。
        run: |
          GITLEAKS_VERSION="8.28.0"
          if ! command -v gitleaks >/dev/null 2>&1; then
            curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz && \
            tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks && \
            sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks || \
              echo "::warning title=Gitleaks 下载失败::跳过全历史扫描（N10 非阻断）"
          fi
          if command -v gitleaks >/dev/null 2>&1 && gitleaks version 2>/dev/null | grep -q "8.28.0"; then
            gitleaks detect --no-git --verbose 2>&1 | tail -20 || \
              echo "::warning title=Gitleaks 检测到疑似凭证::请 rotate + git filter-branch 清理历史（N10 info-only）"
          else
            echo "gitleaks 不可用或版本不符，跳过全历史扫描（N10，非阻断）"
          fi
