name: AITester CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  # 定期依赖豁免复查（P2-4，2026-10-01 全面审查批次）：
  # chromadb 豁免清单（--ignore-vuln PYSEC-*）需定期对照上游
  # "是否已发布修复版" 复查，避免"豁免遗忘"。
  # R10（2026-10-05 审查批次）：security 作业从"仅周日 schedule / 手动
  # 触发"升级为 push/PR 即跑且阻断（pip-audit + bandit + gitleaks +
  # 豁免登记守卫全部硬门禁，2026-10-05 本地实测当前仓库全绿）；本
  # schedule 仅保留"周日全量扫描"语义（附加 gitleaks 全历史扫描与
  # 审计 JSON 工件归档）。豁免登记门禁 check_dependency_exemptions.py
  # 仍在 security 作业每次 push/PR 跑（无网络、快检），
  # "未登记豁免阻断合并"语义不变。
  schedule:
    - cron: "0 6 * * 0"  # 每周日 06:00 UTC
  workflow_dispatch:
    inputs:
      run_security_audit:
        description: "强制重跑依赖豁免审计（P2-4 定期复查）"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

# O10（2026-09-29 审查 P1）：最小化 permissions——默认无权限，
# 仅 code-scanning 与 security 作业需要 pull-requests 读取权限。
permissions:
  contents: read

# P1-10（2026-10-05 独立审查）：同 ref 连续 push 自动取消在途旧 run
#（3 档矩阵 × 全量套件 30s+ 安装 3-8min，旧 run 空跑浪费矩阵资源；
# main 分支取消旧保新，PR 天然 per-ref 无冲突）
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' }}

jobs:
  # 9. P2 #9: LLM 集成冒烟（可选，低默认关闭；成本敏感——仅真实 API 端点连通性
  #    + 最小 JSON 输出校验，不跑基准、不写缓存。AITESTER_SMOKE_LLM=true 时启用，
  #    缺省 false 保持 CI 零 LLM 成本历史口径。作业本身恒运行，内步按开关短路。
  smoke-llm:
    name: Smoke LLM (optional)
    runs-on: ubuntu-latest
    env:
      # P2 #9：push/PR 默认关闭（历史口径零 LLM 成本）；需要真实 LLM 集成冒烟时设为 true。
      # 冒烟作业读取 LLM_1_API_KEY / LLM_1_BASE_URL / LLM_1_MODEL_NAME（.env 或 Secrets）。
      # R10-c（2026-10-05 审查批次）：周日 schedule 自动开启真实冒烟——
      # 仅当三个 LLM_1_* Secrets 均已配置时置 true（缺任一自动回退 false
      # 跳过并打印说明，防 Secrets 未配置的仓库定时任务恒红）；
      # step 内 `"$AITESTER_SMOKE_LLM" = true` 的条件逻辑保持不变，
      # push/PR 路径仍恒 false（零 LLM 成本口径不受影响）。
      AITESTER_SMOKE_LLM: ${{ github.event_name == 'schedule' && secrets.LLM_1_API_KEY != '' && secrets.LLM_1_BASE_URL != '' && secrets.LLM_1_MODEL_NAME != '' && 'true' || 'false' }}
      AITESTER_LLM_CACHE: '0'
      AITESTER_LLM_CACHE_TTL_DAYS: '0'
    steps:
      - name: Check out code
        # O10（2026-09-29 审查 P1）：SHA 固定——actions/checkout@v4 →
        # 3f3f7fd89f09a93f8006f723897ab77c52b0d3e7（v4.1.1, 2024-01）
        uses: actions/checkout@3f3f7fd89f09a93f8006f723897ab77c52b0d3e7

      - name: Set up Python 3.14
        # O10：SHA 固定——actions/setup-python@v6（P1-10：与 test/security
        # 作业同版本对齐，消除同文件 v5/v6 混用）
        uses: actions/setup-python@8d5bc5b086458bc1c9e4c01b4f9f123f37c1c4c0
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov ruff mypy

      - name: LLM 集成冒烟（默认关闭；AITESTER_SMOKE_LLM=true 时跑最小连通性 + JSON 输出校验）
        working-directory: ${{ github.workspace }}/experiments
        env:
          # R10-c：schedule 触发的真实冒烟需把 Secrets 注入环境变量——
          # config._load_llm_configs 只读 LLM_N_* env（CI 无 .env.local，
          # 不注入则 BaseAgent 拿不到任何 LLM 配置）。上方开关守卫已保证
          # 三者任一缺失时 AITESTER_SMOKE_LLM=false，此处的空串注入仅是
          # 跳过路径下的无害占位。
          LLM_1_API_KEY: ${{ secrets.LLM_1_API_KEY }}
          LLM_1_BASE_URL: ${{ secrets.LLM_1_BASE_URL }}
          LLM_1_MODEL_NAME: ${{ secrets.LLM_1_MODEL_NAME }}
        run: |
          if [ "$AITESTER_SMOKE_LLM" = "true" ]; then
            python run_smoke_llm.py
          else
            echo "AITESTER_SMOKE_LLM != true，跳过 LLM 冒烟（历史口径零 LLM 成本）"
            python -c "print('smoke-llm skipped (AITESTER_SMOKE_LLM disabled)')"
          fi

  test:
    runs-on: ubuntu-latest
    # 显式超时上限：防止卡在 pip 网络 / 诊断重跑等步骤最长挂到 GitHub 默认 360 分钟
    timeout-minutes: 30
    strategy:
      matrix:
        # 矩阵与 requirements.txt 的锁定版本对齐（lock 生成自 Python 3.14 开发环境）：
        # - scipy==1.18.0 要求 >=3.12（下限）
        # - pandas==3.0.5 / matplotlib==3.11.1 要求 >=3.11
        # 3.10/3.11 无法安装当前锁定版本集（3.10 也即将 EOL），故矩阵收窄为
        # 3.12（下限）+ 3.13（补 2026-09-28 覆盖缺口：此前被跳过未说明原因，
        # 实际 3.13 处于 scipy/pandas 支持区间内，锁定的 numpy/scipy/pandas
        # 均提供 3.13 wheel，CI 验证安装+测试行为一致）+ 3.14（开发环境）
        python-version: ['3.12', '3.13', '3.14']

    steps:
      - uses: actions/checkout@3f3f7fd89f09a93f8006f723897ab77c52b0d3e7

      - name: Set up Python ${{ matrix.python-version }}
        # O10：SHA 固定——actions/setup-python@v6 →
        # 8d5bc5b086458bc1c9e4c01b4f9f123f37c1c4c0（v6.0.0, 2025-04）
        uses: actions/setup-python@8d5bc5b086458bc1c9e4c01b4f9f123f37c1c4c0
        with:
          python-version: ${{ matrix.python-version }}
          # 缓存 pip wheel：chromadb/onnxruntime/grpcio/pyarrow 等 130 个包冷装很重，
          # 命中缓存可省 3-8 分钟/矩阵
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # requirements.txt 已含 pytest-cov/pytest-timeout 等测试依赖（版本锁定）
          pip install -r requirements.txt
          # ruff 固定版本（与 requirements.lock 中的 ruff==0.16.3 一致）：
          # 此前"始终用最新版"导致上游发版改变格式化规则时，ruff format --check
          # 门禁随机转红（2026-09-09 两次相邻 CI 运行结果不一致即此原因）。
          # 升级 ruff 时同步更新 lock 与 requirements.txt 注释即可。
          pip install "ruff==0.16.3"
          # O34（2026-09-30 全面审查优化 P0）：mypy 此前"装而不用"——test 作业
          # 不安装 mypy（仅 smoke-llm 作业安装且不执行），generate_static_report
          # 的 mypy 块在缺模块时退出码被 main() 恒 0 吞掉，BASELINE.yaml
          # `static_checks.mypy_errors: 0` 从未被 CI 实际验证（此前审查 P0 未闭环）。
          # 现与 ruff 同口径：固定版本安装 + 独立硬门禁步骤。
          # B-05（2026-10-04 系统审查 P1）：mypy 版本与 pre-commit hook
          # （mirrors-mypy v1.15.0，O28 已升级）对齐——此前 CI 锁 1.7.1
          # （2023 年版本，Python 3.12+ 类型支持不完整），本地 hook 绿 ≠
          # CI 绿的双版本漂移。现统一 1.15.0。
          pip install "mypy==1.15.0"

      - name: Install system tools (P0-4 内核沙箱显式启用路径预装 bwrap)
        # P0-4（2026-10-04 优化批次·续四）：内核沙箱（KERNEL_SANDBOX_ENABLE=true）
        # 在 Linux CI 容器走 Landlock+bwrap（bubblewrap）后端。CI 默认 ubuntu-latest
        # 不预装 bwrap → 显式启用 KERNEL_SANDBOX_ENABLE 时 fail-closed 拒绝执行
        # （测试 test_p0_4 锁定该口径）。本步骤预装 bwrap，使"显式启用路径"
        # 在 CI 可实际跑通（默认关 KERNEL_SANDBOX_ENABLE=false 时本步骤仅安装
        # 工具不改变任何默认行为，零行为变化）。安装失败不阻断（非关键路径，
        # bwrap 缺失时 KERNEL_SANDBOX_ENABLE=false 默认路径不受影响）。
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap || \
            echo "::warning title=bubblewrap 安装失败::P0-4 内核沙箱显式启用路径不可用（默认关不受影响）"

      - name: Type check with mypy (O34 硬门禁)
        # 与 BASELINE.yaml static_checks 同口径：mypy src/ config.py 零错误。
        # 退出码非 0 即阻断合并（此前 mypy 结果仅归档快照、从不拦截）。
        run: python -m mypy src/ config.py

      - name: Check lock sync
        run: python scripts/check_lock_sync.py

      - name: Verify experiment artifact checksums (U1 证据链门禁)
        # U1（2026-10-05 系统性审查落地）：主批次工件（汇总 JSON + 统计报告 +
        # traces + SHA256SUMS）已入库（.gitignore 白名单修复）。本步骤校验
        # 工作区工件与 SHA256SUMS 清单一致（防工件被静默篡改/损坏），并附带
        # 校验"清单与实际入库文件集一致"（缺失/多余都报错）。纯 stdlib 快检，
        # 三档矩阵只跑 3.14（工件与 Python 版本无关）。
        if: matrix.python-version == '3.14'
        run: python scripts/checksum_results.py --results-dir experiments/results/main_batch --verify

      - name: Check zero-assertion tests (U3 弱断言守卫)
        # U3（2026-10-05 系统性审查落地）：tests/ 内"零断言"测试函数守卫——
        # 无任何 assert 信号（assert 语句 / assert_* 调用 / pytest.raises 等）
        # 的用例使行覆盖率虚高。AST 静态扫描，豁免清单内置于脚本（EXEMPT）。
        if: matrix.python-version == '3.14'
        run: python scripts/check_zero_assert_tests.py

      - name: Check baseline numbers (11. 漂移守卫)
        # 核心文档"当前基线"块不得硬编码会过期的测试/静态检查数字
        #（README "测试状态" 表指向 BASELINE.yaml；历史叙事章节豁免）
        run: python scripts/check_baseline_numbers.py

      - name: Validate BASELINE.yaml (5b. 结构校验)
        # BASELINE.yaml 必填字段/取值区间/基线全绿约定结构校验（快检，不跑全量测试）
        run: python scripts/check_baseline.py

      - name: Check bilingual docs pairing (P1 文档承诺落地门禁)
        # CONTRIBUTING.md / PULL_REQUEST_TEMPLATE.md / pre-commit.sh 声称
        # "双语文档由 CI check_bilingual_docs 守卫"，此前 CI 全文无调用步骤
        #（文档承诺与 CI 实现漂移，2026-10-01 全面审查 P1 修复）。
        # R10-b（2026-10-05 审查批次）：软门禁显式化——去掉 `|| exit 0`
        # 兜底（其会把真实失败也吞成绿，步骤红/绿不可见），改
        # continue-on-error: true。
        # R10-b 转硬（2026-10-05 文档批次）：此前阻断转硬的 7 项已全部补齐——
        #   ① CHANGELOG.en.md 补齐 6 个缺失章节（2026-10-04 续/续二/续三/续四/
        #      首次批次 + 2026-09-29 G8 批次，41=41 章节对齐）；
        #   ② 6 个英文文档补 "Last updated:" 行（algorithm_design /
        #      dependency_exemptions / failure_analysis /
        #      roadmap_2026-09-27_gap_audit / threat_model / CHANGELOG）。
        # 实测证据（2026-10-05 本地）：check_bilingual_docs --strict
        #   "双语文档同步检查通过（0 警告 / 0 失败）"。据此去掉
        # continue-on-error 转为阻断门禁。
        # 注意：YAML 块标量（|）——此前写成 plain scalar 时续行的 "}" 触发
        # flow-mapping 解析错误（整个 ci.yml 无法被 YAML 解析器加载）。
        run: python scripts/check_bilingual_docs.py --strict

      - name: Generate static-check snapshot (5a. 归档 docs/history/)
        # 批次落地后把 ruff / mypy 实测输出归档为带时间戳的 Markdown 快照，
        # 取代 docs/code_analysis_report.md 的过期人肉快照；同日重跑覆盖同名文件
        run: python scripts/generate_static_report.py

      - name: Upload static snapshot (main branch)
        if: matrix.python-version == '3.14' && github.ref == 'refs/heads/main'
        # O10：SHA 固定——actions/upload-artifact@v4 →
        # 84488ed32758509799cae3ed5e43ef903669d08b（v4.2.0, 2024-02）
        uses: actions/upload-artifact@84488ed32758509799cae3ed5e43ef903669d08b
        with:
          name: static-report-${{ github.run_number }}
          path: docs/history/static_report_*.md
          retention-days: 30

      - name: Lint with ruff
        run: |
          ruff check .
          ruff format --check .

      - name: Run tests with coverage (parallel)
        # 2026-10-01 性能优化批次：pytest-xdist 并行（-n 4 + loadfile 按文件
        # 分片，保持"同文件用例顺序不变"的隔离口径）。默认行为不变——
        # 不传 -n 时退化为历史串行。并行 4 worker 下全量 ~21s（串行 ~49s）。
        # 覆盖率口径不变（pytest-cov 与 xdist 组合仍产出 coverage.xml）。
        run: |
          pytest tests/ -v --cov=src --cov-branch --cov-report=xml --cov-report=term-missing -n 4 --dist loadfile
        env:
          # 使用测试用的 mock API key，避免真实调用
          LLM_1_API_KEY: test-key
          LLM_1_BASE_URL: https://test.example.com
          LLM_1_MODEL_NAME: test-model

      - name: Audit log redaction (4.2)
        # 4.2 日志脱敏门禁：扫描全仓 .py 日志调用点，参数含敏感字段名
        # （api_key/secret/password/Bearer/sk- 等）且未经 _redact /
        # mask_sensitive_info 脱敏 → 退出码 1 阻断合并。
        # 与 .pre-commit-config.yaml 的 audit-log-redaction 钩子同一脚本，
        # 本地提交与远端 CI 口径一致。
        run: python scripts/audit_log_redaction.py

      - name: Credential scrub sync guard (P2 动态推导)
        # 凭证剔除模式从 PROVIDER_TEMPLATES 动态推导（P2 批次）：
        # 新增 provider 键未同步到脱敏口径 → 阻断合并（防 LiteLLM
        # CVE-2026-89032 式静态枚举漂移）。
        run: python scripts/check_credential_scrub.py

      - name: 测试失败诊断（把失败用例清单写成注解，供 API 无权限读取）
        if: failure()
        env:
          # 与上一步 Run tests 保持一致的 mock 配置，避免诊断重跑因缺 LLM_1_* 产生假失败
          LLM_1_API_KEY: test-key
          LLM_1_BASE_URL: https://test.example.com
          LLM_1_MODEL_NAME: test-model
        run: |
          # 重跑套件（--tb=no 只要失败清单，30s 内完成）；
          # 注解可被 check-runs annotations API 公开读取，无需 admin 权限
          LIST=$(pytest tests/ -q --tb=no -rf --no-cov 2>/dev/null | grep -E '^(FAILED|ERROR)' | head -30 | tr '\n' ' | ')
          echo "失败用例清单: ${LIST:-（未捕获到 FAILED/ERROR 行，可能是收集错误或进程崩溃，请查完整日志）}"
          if [ -n "$LIST" ]; then
            echo "::error title=AITester 测试失败清单::$LIST"
          else
            echo "::error title=AITester 测试步骤失败（无失败用例行）::上一步 Run tests with coverage 失败但未捕获 FAILED/ERROR 行（可能是收集错误或崩溃），请查看该步骤完整日志"
          fi

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.14'
        # O10：SHA 固定——codecov/codecov-action@v3 →
        # 675786e5eead34e905aa0f381978be11dd3ed463（v3.4.0, 2024-05）
        uses: codecov/codecov-action@675786e5eead34e905aa0f381978be11dd3ed463
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

      - name: Branch coverage gate (8. 核心路由模块门槛)
        # R10-d（2026-10-05 审查批次）：从"仅 3.14 单档"扩到全部三个矩阵档
        #（3.12/3.13/3.14）。成本评估：上面 "Run tests with coverage" 步骤在
        # 各档本就无条件带 --cov-branch --cov-report=xml（coverage.xml 已在
        # 每档生成），本脚本只是解析既有产物的快检（毫秒级）——扩档零额外
        # 测试成本，仅多两次脚本运行；收益是防止"某版本分支覆盖静默劣化"
        # 只在 3.14 被拦截。2026-10-05 本地实测（3.14 全量 3950 用例，
        # 总分支覆盖 88% ≥ 77% 门槛）：脚本退出码 0。
        # 解析 coverage.xml：总分支覆盖 ≥77%（脚本 _TOTAL_THRESHOLD 实际值；
        # 2026-10-02 批次回绿口径，ADR-0014 的 85% 已被该批次 Amended）
        # + 总行覆盖 ≥85%（P1-8 新增行覆盖硬门禁，历史口径仅报告）
        # + 核心修复路由模块（graph/workflow.py、agents/error_classifier.py）
        # 逐模块 ≥90%（严格门槛）+ 其余核心路由模块 ≥85%
        run: python scripts/check_branch_coverage.py coverage.xml

  # R10（2026-10-05 审查批次）：security 作业升级为 push/PR 即跑且阻断的
  # 安全门禁（此前仅周日 schedule / 手动触发、部分检查 info-only）：
  #   - bandit 静态安全扫描（自 supply-chain 作业迁入，转阻断）
  #   - gitleaks 工作树凭证扫描（自 supply-chain 作业迁入，转阻断；
  #     全历史扫描保持非阻断周检——历史存量泄漏待凭证轮换，见对应步骤注释）
  #   - pip-audit 依赖漏洞扫描（转阻断：新 advisory 未登记豁免即红）
  #   - 豁免登记守卫 / 文档漂移告警口径不变
  # 转阻断前均已在本地实测当前仓库通过（2026-10-05，见各步骤注释）。
  security:
    name: Security (blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # O10：SHA 固定
      - uses: actions/checkout@3f3f7fd89f09a93f8006f723897ab77c52b0d3e7
        with:
          # 周日全量档的 gitleaks 全历史扫描需要完整 git 历史
          #（push/PR 路径的工作树扫描用不到，多拉历史代价可接受）
          fetch-depth: 0

      - name: Set up Python
        # O10：SHA 固定
        uses: actions/setup-python@8d5bc5b086458bc1c9e4c01b4f9f123f37c1c4c0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install security toolchain
        # 固定版本：与项目"锁版本防漂移"原则一致，避免上游发版改变扫描行为
        #（bandit 自 supply-chain 作业迁入；O34：bandit 1.9.4 修复 ≥3.12 上
        #  ast.Constant.s 移除导致的逐文件扫描失效问题，详见 pyproject
        #  [tool.bandit] 注释）
        run: pip install "pip-audit==2.10.1" "bandit[toml]==1.9.4"

      - name: Bandit security scan (R10 转阻断)
        # 静态安全扫描（仅 src/ 下 Python 代码）。
        # 配置来自 pyproject [tool.bandit]（skip 列表逐项附理由：md5 指纹 /
        # subprocess list 调用 / assert 窄化 / HF revision 钉版本 TODO 等），
        # 新类型 findings（B100 exec / B601 shell / B302 pickle 等）仍会命中。
        # R10：去掉 `|| warning` 兜底转硬门禁——2026-10-05 本地实测
        #（bandit 1.9.4 + 同 pyproject 配置）退出码 0、零 findings。
        run: bandit -r src/ -c pyproject.toml -q

      - name: Install gitleaks (R10 转阻断，SHA256 校验)
        # 下载固定版本官方二进制（v8.28.0, linux_x64）；与本地实测同版本。
        # R10：下载/校验失败直接 fail（fail-closed）——旧版此处降级跳过，
        # 转阻断后"扫描器缺失静默放行"等于门禁失效。ubuntu-latest runner
        # 从 github.com releases 下载可靠性高，失败属基础设施异常应当显红。
        run: |
          GITLEAKS_VERSION="8.28.0"
          if command -v gitleaks >/dev/null 2>&1 && gitleaks version 2>/dev/null | grep -q "$GITLEAKS_VERSION"; then
            echo "gitleaks $GITLEAKS_VERSION 已可用，跳过下载"
            exit 0
          fi
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
          echo "a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Gitleaks working-tree scan (R10 转阻断)
        # 工作树（干净 checkout，即推送代码在 HEAD 的状态）凭证扫描。
        # 自动加载仓库根 .gitleaks.toml（R10 配套：仅豁免 tests/ 脱敏测试
        # 夹具的固定假密钥字面量，见该文件内逐条理由）。
        # --redact：日志/报告不回显命中密钥明文。
        # R10：去掉 `|| warning` 兜底转硬门禁——2026-10-05 本地以同版本
        # 8.28.0 二进制 + 同配置对 HEAD 干净导出实测：9 条 tests/ 夹具命中
        # 经 .gitleaks.toml 豁免后 0 findings、退出码 0。
        run: |
          gitleaks detect --no-git --redact \
            --report-format json --report-path gitleaks_report.json

      - name: Check dependencies for vulnerabilities (R10 转阻断)
        # 说明：safety 工具已于 2024-06 起弃用 `check` 子命令（CI 上退出码 64），
        # 改用 PyPA 维护的 pip-audit。
        # 当前 chromadb==1.5.9 命中 5 条已知漏洞（PYSEC-2026-311 重复两条 + PYSEC-2026-3813/3814/3815），
        # 但 PyPI 上暂无修复版本（1.5.9 为最新版），故显式忽略并在 CHANGELOG/决策日志记录；
        # 一旦发布修复版本，应升级并移除对应 --ignore-vuln。
        # 注：9-11 审计复跑后漏洞 ID 由旧 CVE-2026-45830/45831/45833 漂移为
        # PYSEC-2026-3813/3814/3815，本豁免清单与本地 pip-audit 实测结果同步（2026-09-11）。
        # 豁免治理：所有 --ignore-vuln 必须在 docs/dependency_exemptions.md 登记表
        # 留痕（依赖 / 版本 / 漏洞 ID / 豁免原因 / 复审触发条件 / 复审期限），
        # 与 CONTRIBUTING.md "依赖豁免登记" 口径一致。
        # R10：去掉 `|| warning` 降级兜底转硬门禁（新 advisory 未登记豁免
        # 即阻断合并）；失败时仍把 JSON 报告打到日志 + 工件供定位。
        # 2026-10-05 本地实测（pip-audit 2.10.1 同版本 + 同豁免清单）：
        # "No known vulnerabilities found, 5 ignored"，退出码 0。
        run: |
          pip-audit -r requirements.txt --no-deps \
            --ignore-vuln PYSEC-2026-311 \
            --ignore-vuln PYSEC-2026-3813 \
            --ignore-vuln PYSEC-2026-3814 \
            --ignore-vuln PYSEC-2026-3815 \
            -f json -o pip_audit_latest.json || {
            code=$?
            echo "::error title=pip-audit 退出码非 0（R10 阻断）::出现未豁免的新漏洞或网络错误；JSON 报告见下方输出与工件，新 advisory 请评估升级，暂无法修复时按 docs/dependency_exemptions.md 流程登记豁免"
            cat pip_audit_latest.json 2>/dev/null || echo "(无 JSON 输出——网络错误时可能未生成)"
            exit "$code"
          }
          echo "=== pip-audit 通过（最近一次审计 JSON 报告） ==="
          cat pip_audit_latest.json

      - name: Check transitive dependencies for vulnerabilities (P1-7 lock 全量审计)
        # P1-7（2026-10-05 独立审查）：上一步 `pip-audit -r requirements.txt
        # --no-deps` 只审计顶层 24 个直接依赖——requirements.lock 里的 132
        # 项传递依赖（aiohttp/urllib3/grpcio/protobuf/pyarrow 等）此前不进
        # 任何漏洞扫描（SBOM 同样只含顶层）。本步骤对 lock 全量清单审计
        # （pip freeze 口径，pip-audit 原生支持），豁免清单与顶层步骤同款
        # （chromadb 及其豁免登记治理不变）。CI 不按 lock 安装（执行环境
        # 仍走 requirements.txt），lock 审计是"静态全量漏洞面"守卫。
        run: |
          pip-audit -r requirements.lock \
            --ignore-vuln PYSEC-2026-311 \
            --ignore-vuln PYSEC-2026-3813 \
            --ignore-vuln PYSEC-2026-3814 \
            --ignore-vuln PYSEC-2026-3815 \
            -f json -o pip_audit_lock.json || {
            code=$?
            echo "::error title=pip-audit(lock) 退出码非 0（P1-7 阻断）::传递依赖出现未豁免漏洞；新 advisory 请评估升级，暂无法修复时按 docs/dependency_exemptions.md 流程登记豁免"
            cat pip_audit_lock.json 2>/dev/null || echo "(无 JSON 输出——网络错误时可能未生成)"
            exit "$code"
          }
          echo "=== pip-audit(lock) 通过：132 项传递依赖全量审计 ==="

      - name: Upload security scan reports (审计工件)
        # pip-audit / gitleaks 报告：失败排查 + 维护者对照登记表"复审触发
        # 条件"判断 chromadb 上游是否已发布修复版（7 天保留期）。
        if: always()
        # O10：SHA 固定——actions/upload-artifact@v4 →
        # 84488ed32758509799cae3ed5e43ef903669d08b（v4.2.0，2024-02）
        uses: actions/upload-artifact@84488ed32758509799cae3ed5e43ef903669d08b
        with:
          name: security-reports-${{ github.run_number }}
          path: |
            pip_audit_latest.json
            gitleaks_report.json
          retention-days: 7
          if-no-files-found: ignore

      - name: Gitleaks full history scan (R10：非阻断周检)
        # 全历史凭证扫描——保持非阻断（info-only），原因：2026-10-05 本地
        # 实测存在存量历史泄漏（API_MANAGER_EXTENSION_GUIDE.md 已从工作树
        # 删除，但 commit 2e5272a / c505f506 历史中残留一把疑似真实
        # api.agnes-ai.cn 密钥 + 2 条旧版测试夹具误报），转阻断会使 CI
        # 恒红直至"凭证轮换 + git filter-repo 重写历史"完成（需仓库所有者
        # 操作）。工作树阻断扫描（上一步）已覆盖"新推送代码不含凭证"；
        # 本步骤仅周日全量档运行做轮换提醒。
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.run_security_audit == 'true')
        run: |
          gitleaks detect --redact || \
            echo "::warning title=Gitleaks 历史扫描仍有命中::已知存量见步骤注释（历史残留密钥待轮换 + filter-repo 清理；清理完成后本步骤可转阻断）"

      - name: Citation link check (G15：非阻断周检)
        # 文档引用真实性核验（scripts/check_citations.py --online）：对 5 份
        # 前沿基线综述中的 arXiv / DOI 做存在性 HEAD 核验。非阻断（continue-
        # on-error）原因：外部端点限流 / DNS 抖动会造成假红，与"代码正确性"
        # 无关的基建噪声不应阻断合并；missing 命中以 ::warning 提示人工修
        # 正引用。仅周日全量档 / 手动安全审计时运行（push/PR 不引入网络依赖）。
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.run_security_audit == 'true')
        continue-on-error: true
        run: |
          python scripts/check_citations.py --online --no-strict || \
            echo "::warning title=引用核验出现 missing::见上方输出清单，人工核对对应综述文档中的编号"

      - name: Check dependency exemption registry
        # 依赖豁免治理门禁：ci.yml 的 --ignore-vuln 列表必须在
        # docs/dependency_exemptions.md 登记（每条漏洞 ID 命中登记表某一行）；
        # 未登记的豁免 → 退出码 1 阻断合并（防"加了 --ignore-vuln 却没留痕"漂移）。
        run: python scripts/check_dependency_exemptions.py

      - name: Check docs history baseline drift (warning-only)
        # 文档一致性治理（P2）：docs/history/ 下的历史快照文档若声明的
        # 基线数字与 BASELINE.yaml 偏离超过阈值（默认 10%），输出 warning
        # 提示"该文档可能已被当前基线覆盖，考虑归档"。非阻断门禁
        #（warning-only），保持历史叙事文档不受当前基线刷新影响。
        # 检测范围：docs/history/*.md 中匹配 "N passed" / "N tests" 的声明，
        # 与 BASELINE.yaml 的 tests.total_passed 对比。
        run: python scripts/check_docs_history_drift.py --warn-only

  # N10（2026-09-29 审查 P2）→ R10（2026-10-05 审查批次）：供应链安全
  # 工具链收敛为"SBOM 生成 + 归档"单一职责（保持非阻断 info-only）——
  # bandit / gitleaks 已迁入 security 作业并转阻断（安全门禁归口一处），
  # 本作业不再做判定类扫描。
  supply-chain:
    name: Supply chain (SBOM, info-only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # R10：无需完整 git 历史（gitleaks 已迁出），默认浅检出即可
      - uses: actions/checkout@3f3f7fd89f09a93f8006f723897ab77c52b0d3e7

      - name: Set up Python
        uses: actions/setup-python@8d5bc5b086458bc1c9e4c01b4f9f123f37c1c4c0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install cyclonedx-bom
        # 锁版本防漂移（与 security 作业 / release.yml 同版本口径）
        run: pip install "cyclonedx-bom==4.5.0"

      - name: Generate CycloneDX SBOM (N10)
        # 生成 CycloneDX 格式 SBOM（Software Bill of Materials），
        # 上传为工件供合规审查
        run: |
          cyclonedx-py requirements.txt -o sbom.cyclonedx.json || \
            pip install cyclonedx-python && cyclonedx-python requirements.txt -o sbom.cyclonedx.json

      - name: Upload SBOM artifact
        if: always()
        uses: actions/upload-artifact@84488ed32758509799cae3ed5e43ef903669d08b
        with:
          name: sbom-cyclonedx-${{ github.run_number }}
          path: sbom.cyclonedx.json
          retention-days: 90
