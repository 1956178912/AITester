# N-新增（2026-10-05 复审）：依赖自动更新流。
# 背景：CI 已有 pip-audit 阻断 + requirements.lock 同步守卫 + actions SHA
# 钉版，但依赖更新靠人工轮次——chromadb 1.5.9 四条 PYSEC 豁免（决策日志
# 2026-09-09）这类"等上游发版"的事项没有自动跟进通道。Dependabot 周更
# PR 漏斗化：安全更新即时、常规更新每周；合并前仍过 CI 全量门禁（lock
# 同步守卫会拦截 requirements.txt/lock 不一致的 PR）。
version: 2
updates:
  # Python 依赖：requirements.txt（锁定清单）与 pyproject.toml
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    labels:
      - dependencies
    # requirements.lock 与 requirements.txt 的同步由 scripts/check_lock_sync.py
    # 在 CI 守卫——Dependabot 只提 requirements.txt/pyproject 的更新 PR，
    # lock 由维护者在同一 PR 内重跑 pip freeze 同步（守卫会强制提示）
    commit-message:
      prefix: "build"
  # GitHub Actions：本仓 action 全部 SHA 钉版（O10 口径），Dependabot
  # 支持 SHA 引用的版本更新
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Shanghai
    open-pull-requests-limit: 3
    labels:
      - dependencies
    commit-message:
      prefix: "ci"
