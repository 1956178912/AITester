# R10（2026-10-05 审查批次）：gitleaks 从 supply-chain 作业（info-only）
# 移入 security 作业并转阻断的配套豁免配置。
#
# 豁免范围：仅 tests/ 目录下"日志脱敏 / 凭证剔除"测试夹具中的固定假密钥
# 字面量——这些字符串是断言"密钥必须被 <REDACTED_* > 脱敏"的输入数据，
# 属有意设计（与 pyproject [tool.bandit] skip / [tool.ruff] per-file-ignores
# 对 tests/ 的豁免口径一致）。
#
# 豁免方式：按"假密钥完整字面量"精确正则匹配，不做整目录路径豁免——
# tests/ 中新出现的其他形态密钥（真实泄漏进测试的凭证）仍会被命中阻断。
# 需新增豁免时：先确认该字符串确为夹具假密钥（非真实凭证），再逐条登记
# 并注明用途（与 docs/dependency_exemptions.md 的豁免登记治理口径一致）。
#
# 注意：自定义配置文件必须带 [extend] useDefault = true——否则 gitleaks
# 仅使用本文件规则（170+ 条内置规则全部失效，扫描形同虚设）。
[extend]
useDefault = true

[[allowlists]]
description = "tests/ 脱敏测试夹具的固定假密钥字面量（断言输入数据，非真实凭证）"
regexes = [
    # tests/test_cli_parallel.py:178 — 构造 "sk- + 24 位字母数字" 的 mock 失效密钥
    '''sk-abc123def456ghi789jkl012''',
    # tests/test_branch_coverage_fill.py:699 — redact_dict 脱敏断言的夹具 api_key
    '''sk-abcdef123456789012345678''',
    # tests/test_branch_coverage_fill.py:714 — mask_sensitive_info 32 位 hex 夹具
    '''a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6''',
    # tests/test_logging_utils.py:430 — AWS 官方文档公开示例密钥（非真实凭证）
    '''wJalrXUtnFEMIK7MDENGBPxRfiCYEX''',
    # tests/test_logging_utils.py:33 — 高熵假密钥夹具（点号转义，精确匹配）
    '''sk-ws-AbCdEf\.GhIjKlMnOpQrStUvWxYz123AbCdEf\.GhIjKlMnOpQrStUvWxYz01234567890-Wg7pU-s''',
    # tests/test_logging_utils.py:47/437 — 小写 key= 锚定回归夹具
    '''abcd123456efgh''',
    # tests/test_logging_utils.py:430 — DB_SECRET= 形态拦截夹具
    '''abcdef123456''',
    # tests/test_logging_utils.py:340 — JWT 官方文档示例 token 的 header+payload
    # 段（signature 段由 secrets.token_urlsafe 随机生成；真实泄漏的 JWT
    # payload 不同 → 不命中本豁免，仍会被 jwt 规则检出）
    '''eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9\.eyJzdWIiOiIxMjM0NTY3ODkwIn0\.''',
]
